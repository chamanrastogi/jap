    }

    .q-dot.correct { border-color: var(--correct); background: rgba(34,197,94,0.15); color: var(--correct); }
    .q-dot.wrong { border-color: var(--wrong); background: rgba(239,68,68,0.15); color: var(--wrong); }
    .q-dot.reviewed::after {
      content: ''; position: absolute; top: -2px; right: -2px;

    .q-dot.skipped { opacity: 0.5; }

    .filter-section { margin-bottom: 1rem; }

    }

      display: flex; gap: 0.4rem; flex-wrap: wrap;

      cursor: pointer; transition: all 0.2s; user-select: none;

    .filter-chip.diff-med.active { background: var(--tag-med); color: #000; border-color: var(--tag-med); }
    .filter-chip.diff-hard.active { background: var(--tag-hard); color: #fff; border-color: var(--tag-hard); }
    .quiz-area { min-height: 300px; display: flex; flex-direction: column; }

      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.75rem; flex-wrap: wrap; gap: 0.4rem;
    }
    .q-number {

      display: flex; align-items: center; gap: 0.5rem;

      display: inline-flex; align-items: center; justify-content: center;

    }
    .q-badges { display: flex; gap: 0.35rem; flex-wrap: wrap; }

    .q-badge.hard { background: rgba(239,68,68,0.15); color: var(--tag-hard); }
    .q-tags { display: flex; gap: 0.3rem; margin-bottom: 1rem; flex-wrap: wrap; }

    .footer-text {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 0.75rem; padding-top: 0.75rem;
      border-top: 1px solid var(--soft-border);

    }

  {"id":31,"category":"case-problems","difficulty":"hard","exp":"senior","tags":["architecture","cart","ecommerce"],"q":"Design a shopping cart that persists across guest sessions and login merge.","a":"<strong>Approach</strong>:<br><br><strong>Database</strong>:<br><code>Cart</code> model: <code>user_id</code> (nullable), <code>session_id</code>, product_id, quantity, created_at.<br><br><strong>CartService</strong>:<br>â€¢ <code>addItem(productId, quantity)</code> â€” upsert by product<br>â€¢ <code>removeItem(productId)</code><br>â€¢ <code>getTotal()</code> â€” sum of (price Ã— quantity)<br>â€¢ <code>clear()</code><br><br><strong>Guest flow</strong>: cart stored with <code>session_id</code> only. Data loaded on every page via <code>ViewComposer</code> or middleware.<br><br><strong>Login merge</strong>: on <code>Login</code> event, call <code>CartService::mergeCarts(sessionCart, userCart)</code>:<br>â€¢ For each guest item: if user has same product, sum quantities (capped at stock). Else, attach to user.<br>â€¢ Delete session cart after merge.<br><br><strong>Edge cases</strong>:<br>â€¢ Product deleted during session â†’ show \"Unavailable\" with remove option<br>â€¢ Quantity overflow â†’ limit to stock<br>â€¢ Duplicate items â€” upsert logic prevents duplicates<br>â€¢ Concurrent sessions â†’ last-write-wins (acceptable for carts)","options":["Approach:Database:Cart model: user_id (nullable), session_id, product_id, quantity, created_at.CartService:â€¢ addItem(productId, quantity) â€”.","Use a monolithic approach without any separation of concerns or modular design.","Implement everything using raw PHP files without any framework.","Outsource all architecture decisions to a third-party service provider."],"correct":0},
  {"id":1001,"category":"case-problems","difficulty":"hard","exp":"senior","tags":["architecture","forms","multi-step"],"q":"Design a multi-step form with data persistence across sessions.","a":"<strong>Approach</strong>:<br>â€¢ <code>UserRegistration</code> model with JSON <code>data</code> column, <code>current_step</code> (int), <code>completed</code> (bool)<br>â€¢ Each step validates its own subset of fields before advancing<br>â€¢ Temporary data stored in session, persisted to DB only on final step<br>â€¢ On step advance: merge validated data into JSON column, increment step<br>â€¢ On back: restore from DB/session without re-validating<br><br><strong>Implementation</strong>:<br><code>public function store(Request $request, $step) {<br>    $validated = $request->validate(StepValidation::rules()[$step]);<br>    $registration = UserRegistration::findOrFail(session('registration_id'));<br>    $data = array_merge($registration->data ?? [], $validated);<br>    $registration->update(['data' => $data, 'current_step' => $step]);<br>    if ($step === StepValidation::LAST_STEP) {<br>        $registration->update(['completed' => true]);<br>        event(new RegistrationCompleted($registration));<br>    }<br>}</code><br><br><strong>Edge cases</strong>:<br>â€¢ Browser closed mid-form â†’ recover from DB using session token<br>â€¢ Expired sessions â†’ clean up with scheduled job (weekly)<br>â€¢ Back button â†’ restore prior step data without re-validation<br>â€¢ Concurrent submissions â†’ use row lock to prevent overwrite<br>â€¢ File uploads in intermediate steps â†’ store temp files, clean on abandon","options":["Approach:â€¢ UserRegistration model with JSON data column, current_step (int), completed (bool)â€¢ Each step validates its own subset of fields.","Use a monolithic approach without any separation of concerns or modular design.","Implement everything using raw PHP files without any framework.","Outsource all architecture decisions to a third-party service provider."],"correct":0},
  {"id":1002,"category":"case-problems","difficulty":"hard","exp":"senior","tags":["architecture","rbac","authorization"],"q":"Design a role-based access control (RBAC) system.","a":"<strong>Approach</strong>:<br>â€¢ <code>Role</code> (belongsToMany users), <code>Permission</code> (belongsToMany roles)<br>â€¢ Pivot tables: <code>role_user</code>, <code>permission_role</code><br>â€¢ <code>User</code> model has permissions through roles<br><br><strong>Authorization layer</strong>:<br><code>Gate::define('edit-post', fn($user, $post) =><br>    $user->hasPermission('edit-posts') || $user->id === $post->user_id<br>);</code><br><br><strong>Cache strategy</strong>:<br><code>public function hasPermission($perm): bool {<br>    return Cache::remember('user.' . $this->id . '.permissions', 3600, function () use ($perm) {<br>        return $this->roles->pluck('permissions')->flatten()->pluck('slug')->contains($perm);<br>    });<br>}</code><br><br><strong>Middleware</strong>:<br><code>Route::middleware('role:admin,editor')</code><br><br><strong>Edge cases</strong>:<br>â€¢ Circular permissions â†’ keep role-permission hierarchy flat<br>â€¢ Super admin â†’ explicit bypass check at top of hasPermission()<br>â€¢ Cache invalidation â†’ clear cache on role/permission assignment<br>â€¢ Soft-deleted roles â†’ exclude from query, notify admins","options":["Approach:â€¢ Role (belongsToMany users), Permission (belongsToMany roles)â€¢ Pivot tables: role_user, permission_roleâ€¢ User model has permissions.","Use a monolithic approach without any separation of concerns or modular design.","Implement everything using raw PHP files without any framework.","Outsource all architecture decisions to a third-party service provider."],"correct":0},
  {"id":1003,"category":"case-problems","difficulty":"hard","exp":"senior","tags":["architecture","api","rest","pagination"],"q":"Build a RESTful API with pagination, filtering, and sorting.","a":"<strong>Approach</strong>:<br>â€¢ Use query builder with conditional <code>when()</code> for dynamic filters<br>â€¢ Whitelist allowed sort columns to prevent SQL injection<br>â€¢ API Resource collection for consistent response transformation<br>â€¢ Form Request validation for query string parameters<br><br><strong>Controller example</strong>:<br><code>public function index(ProductIndexRequest $request) {<br>    return Product::query()<br>        ->when($request->category_id, fn($q, $v) => $q->where('category_id', $v))<br>        ->when($request->min_price, fn($q, $v) => $q->where('price', '>=', $v))<br>        ->when($request->in_stock, fn($q, $v) => $q->where('stock', '>', 0))<br>        ->when($request->sort, fn($q, $v) => in_array($v, ['name','price','created_at']) ? $q->orderBy($v, $request->direction ?? 'asc') : $q)<br>        ->paginate($request->per_page ?? 15);<br>}</code><br><br><strong>Edge cases</strong>:<br>â€¢ Invalid sort field â†’ return 422 with clear error<br>â€¢ SQL injection via sort â†’ whitelist prevents raw column names<br>â€¢ Very large datasets â†’ enforce max per_page, use cursor pagination<br>â€¢ Empty results â†’ return empty data array, not 404<br>â€¢ N+1 on relationships â†’ use with() for common includes","options":["Approach:â€¢ Use query builder with conditional when() for dynamic filtersâ€¢ Whitelist allowed sort columns to prevent SQL injectionâ€¢ API Resource.","Use a monolithic approach without any separation of concerns or modular design.","Implement everything using raw PHP files without any framework.","Outsource all architecture decisions to a third-party service provider."],"correct":0},
  {"id":1005,"category":"case-problems","difficulty":"hard","exp":"senior","tags":["architecture","file-upload","images","storage"],"q":"Design a file upload system with image optimization and CDN delivery.","a":"<strong>Approach</strong>:<br>â€¢ Intervention Image for resize + optimize<br>â€¢ S3 storage with CloudFront CDN<br>â€¢ Queue resize/optimization jobs for async processing<br>â€¢ Polymorphic <code>Media</code> table for attachment to any model<br><br><strong>Validation</strong>:<br><code>'file' => 'required|image|mimes:jpg,png,webp|max:2048'</code><br><br><strong>Upload + queue</strong>:<br><code>$path = $request->file('file')->store('uploads/' . date('Y/m'), 's3');<br>$media = Media::create([<br>    'path' => $path, 'disk' => 's3',<br>    'mime_type' => $request->file('file')->getMimeType(),<br>    'size' => $request->file('file')->getSize(),<br>]);<br>OptimizeImage::dispatch($media);</code><br><br><strong>Edge cases</strong>:<br>â€¢ Malicious file upload â†’ validate MIME + scan with ClamAV<br>â€¢ Disk quota â†’ check user storage usage before accepting<br>â€¢ CDN cache purge â†’ CloudFront invalidation after update/delete<br>â€¢ Concurrent resize â†’ queue deduplication (uniqueBy media_id)<br>â€¢ EXIF data stripping â†’ remove before storing for privacy","options":["Approach:â€¢ Intervention Image for resize + optimizeâ€¢ S3 storage with CloudFront CDNâ€¢ Queue resize/optimization jobs for async processingâ€¢.","Use a monolithic approach without any separation of concerns or modular design.","Implement everything using raw PHP files without any framework.","Outsource all architecture decisions to a third-party service provider."],"correct":0}
]</script>
  <script>
    const STORAGE_KEY = 'practive_progress';
    const LETTERS = ['A', 'B', 'C', 'D'];
    const DIFF_LABELS = { easy: 'Easy', med: 'Medium', hard: 'Hard' };

    let questions = [];
    let filtered = [];
    let currentIndex = 0;
    let currentDiff = 'all';
    let answers = {};
    let hasAnswered = {};
    let reviewed = {};

    function loadState() {
      try {
        const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (d) { answers = d.answers || {}; hasAnswered = d.hasAnswered || {}; reviewed = d.reviewed || {}; }
      } catch {}
    }
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ answers, hasAnswered, reviewed }));
    }
    function clearState() {
      answers = {}; hasAnswered = {}; reviewed = {};
      saveState();
      applyFilters();
    }

    function updateStats() {
      let attempted = 0, correct = 0, wrong = 0, reviewCount = 0;
      filtered.forEach(q => {
        if (hasAnswered[q.id]) {
          attempted++;
          if (answers[q.id] === q.correct) correct++;
          else wrong++;
        }
        if (reviewed[q.id]) reviewCount++;
      });
      document.getElementById('statAttempted').textContent = attempted;
      document.getElementById('statCorrect').textContent = correct;
      document.getElementById('statWrong').textContent = wrong;
      document.getElementById('statReviewed').textContent = reviewCount;
      const pct = filtered.length > 0 ? (attempted / filtered.length) * 100 : 0;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('totalInfo').textContent = filtered.length + ' question' + (filtered.length !== 1 ? 's' : '');
    }

    function renderGrid() {
      const grid = document.getElementById('qGrid');
      grid.innerHTML = filtered.map((q, idx) => {
        let cls = 'q-dot';
        if (idx === currentIndex) cls += ' active';
        if (hasAnswered[q.id]) {
          cls += answers[q.id] === q.correct ? ' correct' : ' wrong';
        }
        if (reviewed[q.id]) cls += ' reviewed';
        return `<div class="${cls}" data-gidx="${idx}" title="Go to Q${idx + 1}">${idx + 1}</div>`;
      }).join('');
      grid.querySelectorAll('.q-dot').forEach(dot => {
        dot.addEventListener('click', () => {
          currentIndex = parseInt(dot.dataset.gidx);
          renderQuestion();
        });
      });
    }

    function toggleReview() {
      const q = filtered[currentIndex];
      if (!q) return;
      if (reviewed[q.id]) delete reviewed[q.id];
      else reviewed[q.id] = true;
      saveState();
      renderQuestion();
    }

    function renderQuestion() {
      const area = document.getElementById('quizArea');
      if (filtered.length === 0) {
        area.innerHTML = `<div class="empty-state"><i class="bi bi-compass"></i><h5>No questions match</h5><p>Try a different difficulty filter.</p></div>`;
        updateStats();
        return;
      }
      if (currentIndex >= filtered.length) currentIndex = filtered.length - 1;
      if (currentIndex < 0) currentIndex = 0;

      const q = filtered[currentIndex];
      const answered = hasAnswered[q.id];
      const selected = answers[q.id];
      const isCorrect = answered && selected === q.correct;
      const tags = q.tags || [];
      const diffClass = q.difficulty === 'easy' ? 'easy' : q.difficulty === 'med' ? 'med' : 'hard';
      const isReviewed = !!reviewed[q.id];

      let html = `<div class="slide-in">
        <div class="q-meta">
          <div class="q-number"><span class="num-badge">${currentIndex + 1}/${filtered.length}</span></div>
          <div class="q-badges">
            <span class="q-badge ${diffClass}">${DIFF_LABELS[q.difficulty] || q.difficulty}</span>
            <span class="filter-chip" id="reviewToggle" style="font-size:0.65rem;padding:0.15rem 0.5rem;${isReviewed ? 'background:var(--saffron);color:#fff;border-color:var(--saffron)' : ''}"><i class="bi ${isReviewed ? 'bi-bookmark-fill' : 'bi-bookmark'}"></i> Review</span>
          </div>
        </div>
        <div class="q-tags">${tags.filter(t => t !== 'case-problems').map(t => `<span class="q-tag">#${t}</span>`).join('')}</div>
        <div class="q-text">${q.q}</div>
        <div class="options-list">`;

      q.options.forEach((opt, i) => {
        let cls = 'option-btn';
        if (answered) {
          cls += ' disabled';
          if (i === q.correct) cls += ' reveal-correct';
          if (i === selected && i !== q.correct) cls += ' wrong';
          if (i === selected && i === q.correct) cls += ' correct';
        }
        html += `<button class="${cls}" data-optindex="${i}" ${answered ? 'disabled' : ''}>
          <span class="opt-letter">${LETTERS[i]}</span>
          <span>${opt}</span>
        </button>`;
      });

      html += `</div>`;

      if (answered) {
        const fbClass = isCorrect ? 'correct-fb' : 'wrong-fb';
        const icon = isCorrect ? 'bi-check-circle-fill' : 'bi-x-circle-fill';
        const msg = isCorrect ? 'Correct!' : 'Incorrect';
        html += `<div class="feedback-area show ${fbClass}">
          <strong><i class="bi ${icon} fb-icon"></i>${msg}</strong>
        </div>`;
        html += `<div class="answer-detail show">${q.a}</div>`;
        html += `<div class="nav-btns">
          <button class="nav-btn" id="prevBtn"${currentIndex === 0 ? ' disabled' : ''}><i class="bi bi-chevron-left"></i> Prev</button>
          <button class="nav-btn" id="nextBtn"${currentIndex >= filtered.length - 1 ? ' disabled' : ''}>Next <i class="bi bi-chevron-right"></i></button>
        </div>`;
      } else {
        html += `<div class="feedback-area" id="feedbackArea"></div>`;
        html += `<div class="answer-detail" id="answerDetail"></div>`;
        html += `<div class="nav-btns">
          <button class="nav-btn" id="prevBtn"${currentIndex === 0 ? ' disabled' : ''}><i class="bi bi-chevron-left"></i> Prev</button>
          <button class="nav-btn" id="skipBtn">Skip <i class="bi bi-chevron-right"></i></button>
        </div>`;
      }

      html += `<div class="q-grid-wrap"><div class="q-grid-label">
        Questions
        <span class="legend">
          <span><i class="bi bi-circle-fill" style="color:var(--correct)"></i>correct</span>
          <span><i class="bi bi-circle-fill" style="color:var(--wrong)"></i>wrong</span>
          <span><i class="bi bi-circle-fill" style="color:var(--saffron)"></i>review</span>
        </span>
      </div><div class="q-grid" id="qGrid"></div></div>`;
      html += `</div>`;
      area.innerHTML = html;
      renderGrid();
      bindEvents(q);
      updateStats();
    }

    function bindEvents(q) {
      document.querySelectorAll('.option-btn:not(.disabled)').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.optindex);
          handleAnswer(q, idx);
        });
      });
      const revBtn = document.getElementById('reviewToggle');
      if (revBtn) revBtn.addEventListener('click', toggleReview);
      const prev = document.getElementById('prevBtn');
      if (prev) prev.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(); } });
      const next = document.getElementById('nextBtn');
      if (next) next.addEventListener('click', () => { if (currentIndex < filtered.length - 1) { currentIndex++; renderQuestion(); } });
      const skip = document.getElementById('skipBtn');
      if (skip) skip.addEventListener('click', () => { if (currentIndex < filtered.length - 1) { currentIndex++; renderQuestion(); } });
    }

    function handleAnswer(q, selectedIdx) {
      if (hasAnswered[q.id]) return;
      hasAnswered[q.id] = true;
      answers[q.id] = selectedIdx;
      saveState();
      renderQuestion();
    }

    function applyFilters() {
      filtered = questions.filter(q => {
        if (currentDiff === 'review') return !!reviewed[q.id];
        if (currentDiff !== 'all' && q.difficulty !== currentDiff) return false;
        return true;
      });
      if (filtered.length === 0 && currentDiff === 'review') {
        document.getElementById('quizArea').innerHTML = `<div class="empty-state"><i class="bi bi-bookmark"></i><h5>No reviewed questions</h5><p>Mark questions as <strong>Review</strong> to see them here.</p></div>`;
        updateStats();
        return;
      }
      currentIndex = 0;
      renderQuestion();
    }

    function setDiff(diff) {
      currentDiff = diff;
      document.querySelectorAll('#diffFilters .filter-chip').forEach(c => c.classList.remove('active'));
      const target = document.querySelector(`#diffFilters .filter-chip[data-diff="${diff}"]`);
      if (target) target.classList.add('active');
      applyFilters();
    }

    function loadQuestions() {
      const embedded = document.getElementById('questionsData');
      const fallback = embedded && embedded.textContent.trim()
        ? (() => { try { return JSON.parse(embedded.textContent); } catch { return null; } })()
        : null;

      fetch('problems.json')
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(data => {
          questions = data;
          loadState();
          document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('Reset all progress for this quiz?')) clearState();
          });
          applyFilters();
        })
        .catch(() => {
          if (fallback) {
            questions = fallback;
            loadState();
            document.getElementById('resetBtn').addEventListener('click', () => {
              if (confirm('Reset all progress for this quiz?')) clearState();
            });
            applyFilters();
          } else {
            document.getElementById('quizArea').innerHTML = `
              <div class="empty-state">
                <i class="bi bi-exclamation-triangle"></i>
                <h5>Could not load questions</h5>
                <p>Open via <strong>http://localhost</strong> to load all questions, or ensure <code>problems.json</code> exists alongside this file.</p>
                <div class="mt-2 small text-muted">No embedded fallback data found either.</div>
              </div>`;
          }
        });
    }

    document.querySelectorAll('#diffFilters .filter-chip').forEach(chip => {
      chip.addEventListener('click', () => setDiff(chip.dataset.diff));
    });

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key >= '1' && e.key <= '4') {
        const btns = document.querySelectorAll('.option-btn:not(.disabled)');
        const idx = parseInt(e.key) - 1;
        if (btns[idx]) btns[idx].click();
      }
      if (e.key === 'r' || e.key === 'R') { e.preventDefault(); toggleReview(); }
      if (e.key === 'ArrowLeft') { const btn = document.getElementById('prevBtn'); if (btn && !btn.disabled) btn.click(); }
      if (e.key === 'ArrowRight') { const btn = document.getElementById('nextBtn') || document.getElementById('skipBtn'); if (btn && !btn.disabled) btn.click(); }
    });

    function toggleTheme() {
      const html = document.documentElement;
      const theme = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-bs-theme', theme);
      localStorage.setItem('practive_theme', theme);
      document.querySelector('#themeToggle i').className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
    }

    (function initTheme() {
      const saved = localStorage.getItem('practive_theme');
      if (saved) {
        document.documentElement.setAttribute('data-bs-theme', saved);
        document.querySelector('#themeToggle i').className = saved === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
      }
    })();

    document.getElementById('themeToggle').addEventListener('click', toggleTheme);

    loadQuestions();
  </script>
</body>
</html>
