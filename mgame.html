<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Memory</title>
    <script src="assets/vendor/tailwind/tailwindcdn.js"></script>
    <link rel="stylesheet" href="lib/google-fonts/orbitron/orbitron.css">
    <link rel="stylesheet" href="lib/google-fonts/rajdhani/rajdhani.css">
    <style>
        :root {
            --bg-dark: #05000a;
            --neon-pink: #FF77FF;
            --neon-cyan: #00FFFF;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body { font-family: 'Rajdhani', sans-serif; background: var(--bg-dark); color: white; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; }
        .font-display { font-family: 'Orbitron', monospace; }
        .crt-overlay { position: fixed; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02)); z-index: 1000; background-size: 100% 3px, 3px 100%; pointer-events: none; }
        .vapor-bg { position: fixed; inset: 0; background: linear-gradient(180deg, #05000a 0%, #1a0a2e 60%, #4a1942 100%); z-index: -3; }
        .neon-grid { position: fixed; inset: 0; z-index: -1; background-image: linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px); background-size: 60px 60px; transform: perspective(500px) rotateX(65deg) translateY(-100px); transform-origin: center top; animation: gridMove 10s linear infinite; }
        @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 0 60px; } }
        .card-container { perspective: 1200px; }
        .card { position: relative; width: 100%; aspect-ratio: 1; cursor: pointer; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 4px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--glass-border); }
        .card-back { background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(0, 255, 255, 0.05) 100%); backdrop-filter: blur(10px); }
        .card-front { background: #0d041a; transform: rotateY(180deg); }
        .card.matched { animation: matchPulse 0.6s ease-out; opacity: 0.4; pointer-events: none; }
        @keyframes matchPulse { 50% { transform: rotateY(180deg) scale(1.1); filter: brightness(2) drop-shadow(0 0 15px var(--neon-cyan)); } }
        .stats-panel, .leaderboard-panel { background: rgba(0, 0, 0, 0.7); border: 1px solid var(--glass-border); border-top: 2px solid var(--neon-cyan); backdrop-filter: blur(15px); }
        .glow-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); color: #ccc; padding: 0.6rem 1.2rem; text-transform: uppercase; letter-spacing: 2px; font-size: 0.75rem; transition: 0.3s; }
        .glow-btn:hover:not(:disabled) { border-color: var(--neon-cyan); color: white; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        .glow-btn.active { border-color: var(--neon-pink); color: var(--neon-pink); background: rgba(255, 119, 255, 0.1); }
        .scores-scroll::-webkit-scrollbar { width: 8px; }
        .scores-scroll::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.04); }
        .scores-scroll::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.35); border-radius: 999px; }
        .mode-icon-btn { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; min-width: 84px; padding: 0.85rem 0.65rem; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.03); transition: 0.3s; }
        .mode-icon-btn:hover { border-color: var(--neon-cyan); box-shadow: 0 0 18px rgba(0, 255, 255, 0.18); transform: translateY(-2px); }
        .mode-icon-btn svg { width: 1.6rem; height: 1.6rem; color: var(--neon-cyan); }
        .mode-card { border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); padding: 1rem; }
        .card.shake { animation: shake 0.4s linear; }
        @keyframes shake { 25% { transform: rotateY(180deg) translateX(-5px); } 75% { transform: rotateY(180deg) translateX(5px); } }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="crt-overlay"></div>
    <div class="vapor-bg"></div>
    <div class="neon-grid"></div>

    <header class="text-center mb-6">
        <h1 class="font-display text-4xl md:text-6xl font-black italic text-transparent bg-clip-text bg-gradient-to-b from-white to-purple-600">VAPORMATCH</h1>
    </header>

    <div class="flex flex-col lg:flex-row gap-6 w-full max-w-6xl items-start justify-center">
        <!-- Main Game Section -->
        <div class="flex-1 w-full flex flex-col items-center">
            <div class="w-full max-w-2xl stats-panel rounded grid grid-cols-4 mb-6">
                <div class="p-3 border-r border-white/10 text-center"><p class="text-[9px] text-cyan-400 opacity-60">TIME</p><span id="timer" class="font-display text-xl">00:00</span></div>
                <div class="p-3 border-r border-white/10 text-center"><p class="text-[9px] text-pink-400 opacity-60">SCORE</p><span id="score" class="font-display text-xl">0000</span></div>
                <div class="p-3 border-r border-white/10 text-center"><p class="text-[9px] text-purple-400 opacity-60">COMBO</p><span id="combo" class="font-display text-xl">x1</span></div>
                <div class="p-3 text-center"><p class="text-[9px] text-white opacity-60">MOVES</p><span id="moves" class="font-display text-xl">0</span></div>
            </div>

            <div id="gameGrid" class="grid gap-3 mb-8"></div>

            <section class="w-full max-w-2xl stats-panel rounded p-4 mb-6">
                <div class="flex items-center justify-between gap-3 mb-3 border-b border-white/10 pb-2">
                    <div>
                        <h2 class="font-display text-sm text-cyan-400">HOW_TO_PLAY</h2>
                        <p class="text-[10px] uppercase tracking-[0.3em] text-gray-500">Click an icon for mode tips</p>
                    </div>
                    <button id="openHelpBtn" class="glow-btn !px-3 !py-2 !text-[10px]">Open Guide</button>
                </div>
                <div class="flex flex-wrap justify-center gap-3">
                    <button class="mode-icon-btn" data-help-mode="easy">
                        <svg viewBox="0 0 100 100" fill="none"><rect x="14" y="14" width="24" height="24" stroke="currentColor" stroke-width="6"/><rect x="62" y="14" width="24" height="24" stroke="currentColor" stroke-width="6"/><rect x="14" y="62" width="24" height="24" stroke="currentColor" stroke-width="6"/><rect x="62" y="62" width="24" height="24" stroke="currentColor" stroke-width="6"/></svg>
                        <span class="font-display text-[11px] text-white">EASY</span>
                    </button>
                    <button class="mode-icon-btn" data-help-mode="medium">
                        <svg viewBox="0 0 100 100" fill="none"><path d="M20 20H80V80H20z" stroke="currentColor" stroke-width="6"/><path d="M20 40H80M20 60H80M40 20V80M60 20V80" stroke="currentColor" stroke-width="4"/></svg>
                        <span class="font-display text-[11px] text-white">MEDIUM</span>
                    </button>
                    <button class="mode-icon-btn" data-help-mode="hard">
                        <svg viewBox="0 0 100 100" fill="none"><path d="M16 16H84V84H16z" stroke="currentColor" stroke-width="6"/><path d="M16 33H84M16 50H84M16 67H84M33 16V84M50 16V84M67 16V84" stroke="currentColor" stroke-width="3.5"/></svg>
                        <span class="font-display text-[11px] text-white">HARD</span>
                    </button>
                    <button class="mode-icon-btn" data-help-mode="scoring">
                        <svg viewBox="0 0 100 100" fill="none"><path d="M18 72L38 52L52 66L82 28" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="28" r="10" stroke="currentColor" stroke-width="6"/></svg>
                        <span class="font-display text-[11px] text-white">SCORING</span>
                    </button>
                </div>
            </section>

            <footer class="flex flex-wrap justify-center gap-3">
                <button onclick="setDifficulty('easy')" class="glow-btn active" data-diff="easy">4x4</button>
                <button onclick="setDifficulty('medium')" class="glow-btn" data-diff="medium">6x6</button>
                <button onclick="setDifficulty('hard')" class="glow-btn" data-diff="hard">8x8</button>
                <button onclick="initGame()" class="glow-btn !text-pink-400 border-pink-500/30">RESET</button>
            </footer>
        </div>

        <!-- Leaderboard Section -->
        <div class="w-full lg:w-72 leaderboard-panel rounded p-4">
            <div class="flex items-center justify-between gap-3 mb-4 border-b border-white/10 pb-2">
                <h3 class="font-display text-sm text-cyan-400">TOP_SCORES</h3>
                <button id="viewAllBtn" class="glow-btn !px-3 !py-2 !text-[10px]">View All</button>
            </div>
            <div id="leaderboardList" class="space-y-3 text-xs uppercase tracking-tighter">
                <p class="text-gray-500 animate-pulse">Connecting...</p>
            </div>
        </div>
    </div>

    <!-- Win Modal -->
        <div id="winModal" class="fixed inset-0 bg-black/95 z-[2000] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-black border border-pink-500 p-8 max-w-sm w-full text-center shadow-[0_0_50px_rgba(255,119,255,0.3)]">
            <h2 class="font-display text-4xl italic text-pink-500 mb-4">VICTORY</h2>
            <p id="finalScore" class="text-5xl font-display text-cyan-400 mb-6">0</p>
            <div class="grid grid-cols-2 gap-3 mb-4 text-[11px] uppercase tracking-widest text-gray-300">
                <div class="border border-white/10 p-3">
                    <p class="text-gray-500 mb-1">Moves</p>
                    <p id="finalMoves" class="font-display text-lg text-white">0</p>
                </div>
                <div class="border border-white/10 p-3">
                    <p class="text-gray-500 mb-1">Time</p>
                    <p id="finalTime" class="font-display text-lg text-cyan-400">00:00</p>
                </div>
            </div>
            <input type="text" id="playerName" placeholder="USER_NAME" maxlength="10" class="w-full bg-white/5 border border-white/20 p-3 mb-4 text-center text-white outline-none focus:border-cyan-400 font-display">
            <button id="saveBtn" class="w-full py-3 bg-pink-500 text-black font-black uppercase tracking-tighter hover:bg-cyan-400 transition-colors">Submit Score</button>
            <button onclick="closeWinModal()" class="w-full text-gray-500 text-[10px] uppercase mt-4">Cancel</button>
        </div>
    </div>

    <div id="scoresModal" class="fixed inset-0 bg-black/90 z-[1999] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-black border border-cyan-500/60 p-6 max-w-3xl w-full max-h-[85vh] flex flex-col">
            <div class="flex items-center justify-between gap-3 mb-4 border-b border-white/10 pb-3">
                <div>
                    <h2 class="font-display text-2xl text-cyan-400">ALL_SCORES</h2>
                    <p class="text-[10px] uppercase tracking-[0.3em] text-gray-500">Ranked by score, time, moves</p>
                </div>
                <button id="closeScoresBtn" class="glow-btn !px-3 !py-2 !text-[10px]">Close</button>
            </div>
            <div id="allScoresList" class="scores-scroll flex-1 overflow-y-auto space-y-3 pr-2 text-xs uppercase tracking-tighter">
                <p class="text-gray-500">No scores loaded.</p>
            </div>
        </div>
    </div>

    <div id="helpModal" class="fixed inset-0 bg-black/90 z-[1998] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-black border border-pink-500/60 p-6 max-w-3xl w-full max-h-[85vh] flex flex-col">
            <div class="flex items-center justify-between gap-3 mb-4 border-b border-white/10 pb-3">
                <div>
                    <h2 class="font-display text-2xl text-pink-400">GAME_GUIDE</h2>
                    <p class="text-[10px] uppercase tracking-[0.3em] text-gray-500">How to play every mode</p>
                </div>
                <button id="closeHelpBtn" class="glow-btn !px-3 !py-2 !text-[10px]">Close</button>
            </div>
            <div id="helpContent" class="scores-scroll flex-1 overflow-y-auto pr-2 space-y-4 text-sm text-gray-200"></div>
        </div>
    </div>

    <!-- SVG ICONS -->
    <svg style="display: none;">
        <symbol id="icon-palm" viewBox="0 0 100 100"><path fill="currentColor" d="M50 90V50c0-5 10-25 30-30-15 15-15 25-10 35-10-10-15-5-20 5 5-20 0-30-15-45 5 15 0 30-10 40-5-10-15-15-25-10 15 5 25 20 25 35v40h25z"/></symbol>
        <symbol id="icon-sun" viewBox="0 0 100 100"><circle fill="currentColor" cx="50" cy="50" r="25"/><path stroke="currentColor" stroke-width="4" d="M50 10v10M50 80v10M10 50h10M80 50h10"/></symbol>
        <symbol id="icon-cassette" viewBox="0 0 100 100"><rect fill="none" stroke="currentColor" stroke-width="4" x="10" y="25" width="80" height="50"/><circle fill="currentColor" cx="35" cy="50" r="8"/><circle fill="currentColor" cx="65" cy="50" r="8"/></symbol>
        <symbol id="icon-diamond" viewBox="0 0 100 100"><path fill="currentColor" d="M50 10L90 50L50 90L10 50Z"/></symbol>
        <symbol id="icon-wave" viewBox="0 0 100 100"><path fill="none" stroke="currentColor" stroke-width="6" d="M10 60 Q 30 40 50 60 T 90 60"/></symbol>
        <symbol id="icon-computer" viewBox="0 0 100 100"><rect fill="none" stroke="currentColor" stroke-width="4" x="20" y="20" width="60" height="45"/><rect fill="currentColor" x="30" y="70" width="40" height="5"/></symbol>
        <symbol id="icon-heart" viewBox="0 0 100 100"><path fill="currentColor" d="M50 85C20 60 10 45 10 30 10 15 25 10 35 20 40 25 45 25 50 20 55 10 70 15 90 30 90 45 80 60 50 85Z"/></symbol>
        <symbol id="icon-pillar" viewBox="0 0 100 100"><rect fill="currentColor" x="35" y="20" width="30" height="60"/><rect fill="currentColor" x="30" y="15" width="40" height="5"/><rect fill="currentColor" x="30" y="80" width="40" height="5"/></symbol>
    </svg>

    <script type="module">
        import { initializeApp } from "lib/firebase/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, orderByChild } from "lib/firebase/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtL3oDD3MgkyCCgGpU72KjmDILIN9B3ek",
            authDomain: "studio-6260227459-93b5e.firebaseapp.com",
            databaseURL: "https://studio-6260227459-93b5e-default-rtdb.firebaseio.com",
            projectId: "studio-6260227459-93b5e",
            storageBucket: "studio-6260227459-93b5e.firebasestorage.app",
            messagingSenderId: "1037181898183",
            appId: "1:1037181898183:web:01259c3e5a4d5e9312dde2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const scoresRef = ref(db, 'highscores');
        const leaderboardListEl = document.getElementById('leaderboardList');
        const allScoresListEl = document.getElementById('allScoresList');
        const saveBtnEl = document.getElementById('saveBtn');
        const playerNameEl = document.getElementById('playerName');
        const finalMovesEl = document.getElementById('finalMoves');
        const finalTimeEl = document.getElementById('finalTime');
        const viewAllBtnEl = document.getElementById('viewAllBtn');
        const scoresModalEl = document.getElementById('scoresModal');
        const closeScoresBtnEl = document.getElementById('closeScoresBtn');
        const openHelpBtnEl = document.getElementById('openHelpBtn');
        const helpModalEl = document.getElementById('helpModal');
        const closeHelpBtnEl = document.getElementById('closeHelpBtn');
        const helpContentEl = document.getElementById('helpContent');
        const setLeaderboardStatus = (message, className = 'text-gray-500') => {
            leaderboardListEl.innerHTML = `<p class="${className}">${message}</p>`;
        };
        const setAllScoresStatus = (message, className = 'text-gray-500') => {
            allScoresListEl.innerHTML = `<p class="${className}">${message}</p>`;
        };
        const formatTime = (seconds) => {
            const safeSeconds = Math.max(0, Number(seconds || 0));
            return `${Math.floor(safeSeconds / 60).toString().padStart(2,'0')}:${(safeSeconds % 60).toString().padStart(2,'0')}`;
        };
        const normalizeEntry = (entry = {}) => ({
            name: (entry.name || 'ANON').toString().toUpperCase().slice(0, 10),
            score: Number(entry.score || 0),
            moves: Number(entry.moves || 0),
            time: Number(entry.time || 0),
            difficulty: (entry.difficulty || 'easy').toString().toUpperCase(),
            timestamp: Number(entry.timestamp || 0)
        });
        const sortScores = (entries) => [...entries].sort((a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            if (a.time !== b.time) return a.time - b.time;
            if (a.moves !== b.moves) return a.moves - b.moves;
            return a.timestamp - b.timestamp;
        });
        const helpModes = {
            easy: {
                title: 'Easy Mode 4x4',
                accent: 'text-cyan-400',
                body: [
                    'You play with 8 pairs on a 4x4 grid, so this is the best mode to learn card positions quickly.',
                    'Try to build combo streaks by matching pairs back to back within a short time window.',
                    'Use Easy mode to learn the symbols before moving into bigger boards.'
                ]
            },
            medium: {
                title: 'Medium Mode 6x6',
                accent: 'text-pink-400',
                body: [
                    'Medium gives you 18 pairs on a 6x6 grid, so memory and path planning both matter more.',
                    'Watch your move count because unnecessary guesses can push you down the ranking.',
                    'Scan the full board before rushing your second flip so you save both time and points.'
                ]
            },
            hard: {
                title: 'Hard Mode 8x8',
                accent: 'text-purple-400',
                body: [
                    'Hard uses 32 pairs on an 8x8 grid, making it the longest and most demanding run.',
                    'Work in small mental zones of the board so you do not lose track of recently seen cards.',
                    'Hard mode rewards calm play more than random speed because mistakes cost time, moves, and points.'
                ]
            },
            scoring: {
                title: 'Scoring Rules',
                accent: 'text-yellow-300',
                body: [
                    'Correct matches add 100 points and combos increase the reward when you chain matches quickly.',
                    'Wrong pairings subtract 25 points, so blind guessing can erase a strong run.',
                    'Top scores are ranked by highest score first, then faster time, then fewer moves.'
                ]
            }
        };
        let allScores = [];

        // Game State
        let audioCtx = null;
        const playSynth = (f, t, d) => {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
                g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
                o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d);
            } catch(e) {}
        };

        const state = { diff: 'easy', cards: [], flipped: [], moves: 0, score: 0, combo: 1, lastMatch: 0, matchedPairs: 0, timer: 0, timerRef: null, isLocked: false };
        const iconTypes = ['palm', 'sun', 'cassette', 'diamond', 'wave', 'computer', 'heart', 'pillar'];
        const configs = { easy: { g: 4, p: 8 }, medium: { g: 6, p: 18 }, hard: { g: 8, p: 32 } };

        window.setDifficulty = (d) => {
            state.diff = d;
            document.querySelectorAll('[data-diff]').forEach(b => b.classList.toggle('active', b.dataset.diff === d));
            window.initGame();
        };

        window.initGame = () => {
            clearInterval(state.timerRef);
            Object.assign(state, { moves: 0, score: 0, combo: 1, matchedPairs: 0, timer: 0, flipped: [], isLocked: false });
            updateUI();
            const { g, p } = configs[state.diff];
            const deck = [];
            for(let i=0; i<p; i++) deck.push(iconTypes[i % 8], iconTypes[i % 8]);
            state.cards = deck.sort(() => Math.random() - 0.5);
            renderGrid(g);
            state.timerRef = setInterval(() => { state.timer++; updateUI(); }, 1000);
        };

        const renderGrid = (size) => {
            const grid = document.getElementById('gameGrid');
            grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            const cardSize = Math.min(Math.floor((Math.min(window.innerWidth - 40, 500)) / size) - 8, 80);
            grid.innerHTML = state.cards.map((icon, i) => `
                <div class="card-container" style="width:${cardSize}px; height:${cardSize}px">
                    <div class="card" data-icon="${icon}" id="card-${i}">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front"><svg class="w-1/2 h-1/2 text-cyan-400"><use href="#icon-${icon}"/></svg></div>
                    </div>
                </div>
            `).join('');
            document.querySelectorAll('.card').forEach(c => c.onclick = () => handleFlip(c));
        };

        const handleFlip = (el) => {
            if(state.isLocked || el.classList.contains('flipped') || el.classList.contains('matched')) return;
            playSynth(400, 'triangle', 0.1);
            el.classList.add('flipped');
            state.flipped.push(el);
            if(state.flipped.length === 2) checkMatch();
        };

        const checkMatch = () => {
            state.isLocked = true;
            state.moves++;
            const [c1, c2] = state.flipped;
            if(c1.dataset.icon === c2.dataset.icon) {
                const now = Date.now();
                state.combo = (now - state.lastMatch < 2500) ? state.combo + 1 : 1;
                state.lastMatch = now;
                state.score += (100 * state.combo);
                state.matchedPairs++;
                setTimeout(() => {
                    playSynth(800, 'sine', 0.2);
                    c1.classList.add('matched'); c2.classList.add('matched');
                    state.flipped = []; state.isLocked = false;
                    if(state.matchedPairs === configs[state.diff].p) endGame();
                }, 400);
            } else {
                state.combo = 1;
                state.score = Math.max(0, state.score - 25);
                setTimeout(() => {
                    playSynth(150, 'sawtooth', 0.2);
                    c1.classList.add('shake'); c2.classList.add('shake');
                    setTimeout(() => {
                        c1.classList.remove('flipped', 'shake'); c2.classList.remove('flipped', 'shake');
                        state.flipped = []; state.isLocked = false;
                    }, 400);
                }, 500);
            }
            updateUI();
        };

        const updateUI = () => {
            document.getElementById('timer').textContent = formatTime(state.timer);
            document.getElementById('score').textContent = state.score.toString().padStart(4, '0');
            document.getElementById('combo').textContent = `x${state.combo}`;
            document.getElementById('moves').textContent = state.moves;
        };

        const endGame = () => {
            clearInterval(state.timerRef);
            document.getElementById('finalScore').textContent = state.score;
            finalMovesEl.textContent = state.moves;
            finalTimeEl.textContent = formatTime(state.timer);
            document.getElementById('winModal').style.display = 'flex';
            saveBtnEl.disabled = false;
            saveBtnEl.textContent = "Submit Score";
            setTimeout(() => playerNameEl.focus(), 0);
        };

        window.closeWinModal = () => document.getElementById('winModal').style.display = 'none';
        window.openScoresModal = () => scoresModalEl.style.display = 'flex';
        window.closeScoresModal = () => scoresModalEl.style.display = 'none';
        window.openHelpModal = () => helpModalEl.style.display = 'flex';
        window.closeHelpModal = () => helpModalEl.style.display = 'none';
        viewAllBtnEl.onclick = () => window.openScoresModal();
        closeScoresBtnEl.onclick = () => window.closeScoresModal();
        openHelpBtnEl.onclick = () => {
            renderHelp();
            window.openHelpModal();
        };
        closeHelpBtnEl.onclick = () => window.closeHelpModal();
        document.querySelectorAll('[data-help-mode]').forEach((button) => {
            button.onclick = () => {
                renderHelp(button.dataset.helpMode);
                window.openHelpModal();
            };
        });

        const renderHelp = (focusMode = 'easy') => {
            const orderedModes = [focusMode, ...Object.keys(helpModes).filter((mode) => mode !== focusMode)];
            helpContentEl.innerHTML = orderedModes.map((mode) => {
                const section = helpModes[mode];
                return `
                    <section class="mode-card">
                        <h3 class="font-display text-lg ${section.accent} mb-3">${section.title}</h3>
                        ${section.body.map((line) => `<p class="mb-2 last:mb-0 leading-relaxed">${line}</p>`).join('')}
                    </section>
                `;
            }).join('');
        };

        const renderTopScores = () => {
            const topScores = allScores.slice(0, 5);
            leaderboardListEl.innerHTML = topScores.map((entry, i) => `
                <div class="border-b border-white/5 pb-2">
                    <div class="flex justify-between items-center gap-3">
                        <span class="text-cyan-400 font-bold">#${i + 1} ${entry.name}</span>
                        <span class="text-pink-400 font-display font-bold">${entry.score}</span>
                    </div>
                    <div class="flex justify-between text-[10px] text-gray-400 mt-1">
                        <span>${formatTime(entry.time)}</span>
                        <span>${entry.moves} moves</span>
                    </div>
                </div>
            `).join('') || "<p class='text-gray-600 italic'>NO_DATA_FOUND</p>";
        };

        const renderAllScores = () => {
            allScoresListEl.innerHTML = allScores.map((entry, i) => `
                <div class="border border-white/10 bg-white/5 p-3">
                    <div class="flex justify-between items-center gap-3">
                        <div>
                            <p class="text-cyan-400 font-bold">#${i + 1} ${entry.name}</p>
                            <p class="text-[10px] text-gray-500 mt-1">${entry.difficulty}</p>
                        </div>
                        <p class="font-display text-pink-400 text-lg">${entry.score}</p>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mt-3 text-[10px] text-gray-300">
                        <div>Time: <span class="text-white">${formatTime(entry.time)}</span></div>
                        <div>Moves: <span class="text-white">${entry.moves}</span></div>
                    </div>
                </div>
            `).join('') || "<p class='text-gray-600 italic'>NO_DATA_FOUND</p>";
        };

        // Submit Score
        document.getElementById('saveBtn').onclick = async () => {
            const name = playerNameEl.value.trim().toUpperCase();
            const btn = saveBtnEl;
            if (!name) {
                btn.textContent = "ENTER NAME";
                playerNameEl.focus();
                setTimeout(() => {
                    btn.textContent = "Submit Score";
                }, 1200);
                return;
            }
            btn.disabled = true;
            btn.textContent = "UPLOADING...";

            try {
                await push(scoresRef, {
                    name: name,
                    score: state.score,
                    moves: state.moves,
                    time: state.timer,
                    difficulty: state.diff,
                    timestamp: Date.now()
                });
                btn.textContent = "SUCCESS";
                setTimeout(() => {
                    window.closeWinModal();
                    window.initGame();
                    btn.disabled = false;
                    btn.textContent = "Submit Score";
                    playerNameEl.value = "";
                }, 1000);
            } catch (err) {
                console.error("Save failed:", err);
                btn.textContent = "RETRY";
                btn.disabled = false;
            }
        };

        // Real-time Leaderboard Updates
        const allScoresQuery = query(scoresRef, orderByChild('score'));
        onValue(allScoresQuery, (snapshot) => {
            const data = [];
            snapshot.forEach(child => {
                data.push(normalizeEntry(child.val()));
            });
            allScores = sortScores(data);
            renderTopScores();
            renderAllScores();
        }, (error) => {
            console.error("Leaderboard error:", error);
            setLeaderboardStatus('ACCESS_DENIED', 'text-red-500');
            setAllScoresStatus('ACCESS_DENIED', 'text-red-500');
        });

        window.initGame();
    </script>
</body>
</html>
