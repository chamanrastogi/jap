<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Memory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #05000a;
            --neon-pink: #FF77FF;
            --neon-cyan: #00FFFF;
            --neon-purple: #BF00FF;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .font-display { font-family: 'Orbitron', monospace; }

        /* CRT & Scanline Overlay */
        .crt-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 1000;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        /* Animated Background Elements */
        .vapor-bg {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #05000a 0%, #1a0a2e 60%, #4a1942 100%);
            z-index: -3;
        }

        .retro-sun {
            position: fixed;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 400px;
            background: linear-gradient(to bottom, #ff0080, #ff8c00 80%);
            border-radius: 50%;
            z-index: -2;
            opacity: 0.6;
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%, black 100%);
            -webkit-mask-image: repeating-linear-gradient(0deg, black, black 15px, transparent 15px, transparent 25px);
            filter: blur(2px) drop-shadow(0 0 20px #ff0080);
        }

        .neon-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(500px) rotateX(65deg) translateY(-100px);
            transform-origin: center top;
            animation: gridMove 10s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 60px; }
        }

        /* Card Aesthetics */
        .card-container { perspective: 1200px; }
        .card {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .card-back {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(0, 255, 255, 0.05) 100%);
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 10px rgba(255, 119, 255, 0.1);
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 119, 255, 0.2) 1px, transparent 1px);
            background-size: 10px 10px;
        }

        .card-front {
            background: #0d041a;
            transform: rotateY(180deg);
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .card:hover .card-face {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .card.matched {
            animation: matchPulse 0.6s ease-out;
            opacity: 0.5;
            pointer-events: none;
        }

        @keyframes matchPulse {
            0% { transform: rotateY(180deg) scale(1); filter: brightness(1); }
            50% { transform: rotateY(180deg) scale(1.1); filter: brightness(2) drop-shadow(0 0 15px var(--neon-cyan)); }
            100% { transform: rotateY(180deg) scale(1); filter: brightness(1); }
        }

        /* Dashboard UI */
        .stats-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-border);
            border-top: 2px solid var(--neon-cyan);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
        }

        .glow-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: #ccc;
            padding: 0.6rem 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .glow-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: 0.5s;
        }

        .glow-btn:hover::after { left: 100%; }

        .glow-btn:hover:not(:disabled) {
            color: white;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .glow-btn.active {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            background: rgba(255, 119, 255, 0.1);
            box-shadow: 0 0 15px rgba(255, 119, 255, 0.3);
        }

        #combo-tag {
            position: absolute;
            pointer-events: none;
            color: var(--neon-pink);
            font-family: 'Orbitron';
            font-size: 1.5rem;
            font-weight: 900;
            z-index: 100;
            text-shadow: 0 0 10px var(--neon-pink);
            animation: comboPop 0.8s ease-out forwards;
        }

        @keyframes comboPop {
            0% { opacity: 1; transform: translateY(0) scale(0.5); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
        }

    </style>
</head>
<body class="p-4 md:p-8">
    <div class="crt-overlay"></div>
    <div class="vapor-bg"></div>
    <div class="retro-sun"></div>
    <div class="neon-grid"></div>

    <header class="text-center mb-8 relative">
        <h1 class="font-display text-5xl md:text-7xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white via-cyan-300 to-purple-600 italic">
            GAMER
        </h1>
        <p class="text-[10px] md:text-xs uppercase tracking-[0.5em] text-cyan-300 opacity-60 mt-2 font-display">
            Aesthetic Memory
        </p>
    </header>

    <!-- Stats Dashboard -->
    <div class="w-full max-w-3xl stats-panel rounded-lg grid grid-cols-2 md:grid-cols-4 gap-0 overflow-hidden mb-8">
        <div class="border-r border-b md:border-b-0 border-white/10 p-4 flex flex-col items-center">
            <span class="text-[9px] text-cyan-400/60 uppercase tracking-widest mb-1">Session_Time</span>
            <span id="timer" class="font-display text-2xl text-white">00:00</span>
        </div>
        <div class="border-r border-b md:border-b-0 border-white/10 p-4 flex flex-col items-center">
            <span class="text-[9px] text-pink-400/60 uppercase tracking-widest mb-1">Net_Score</span>
            <span id="score" class="font-display text-2xl text-white">0000</span>
        </div>
        <div class="border-r border-white/10 p-4 flex flex-col items-center">
            <span class="text-[9px] text-purple-400/60 uppercase tracking-widest mb-1">Multi_Link</span>
            <span id="combo" class="font-display text-2xl text-purple-400">x1</span>
        </div>
        <div class="p-4 flex flex-col items-center">
            <span class="text-[9px] text-white/40 uppercase tracking-widest mb-1">Iter_Moves</span>
            <span id="moves" class="font-display text-2xl text-white/80">0</span>
        </div>
    </div>

    <!-- Game Area -->
    <main class="relative z-10">
        <div id="gameGrid" class="grid gap-3 md:gap-4 mb-10"></div>
    </main>

    <!-- Lower Control Panel -->
    <footer class="w-full max-w-2xl space-y-6">
        <div class="flex flex-wrap justify-center gap-3">
            <button onclick="setDifficulty('easy')" class="glow-btn active" data-diff="easy">4x4_SYS</button>
            <button onclick="setDifficulty('medium')" class="glow-btn" data-diff="medium">6x6_SYS</button>
            <button onclick="setDifficulty('hard')" class="glow-btn" data-diff="hard">8x8_SYS</button>
        </div>
        <div class="flex justify-center gap-6 pt-4 border-t border-white/5">
            <button onclick="useHint()" id="hintBtn" class="glow-btn !text-cyan-300">Flash_Hint (3)</button>
            <button onclick="initGame()" class="glow-btn !text-pink-400 font-bold border-pink-500/30">Hard_Reset</button>
        </div>
    </footer>

    <!-- Win Modal -->
    <div id="winModal" class="fixed inset-0 bg-black/80 backdrop-blur-xl z-[2000] hidden items-center justify-center p-4">
        <div class="bg-black border border-pink-500/50 p-10 max-w-md w-full text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-pink-500 shadow-[0_0_15px_#ff77ff]"></div>
            <h2 class="font-display text-5xl italic text-pink-400 mb-2">COMPLETE</h2>
            <p class="text-cyan-300 text-[10px] tracking-[0.4em] mb-8 uppercase">Simulation Successful</p>
            
            <div class="grid grid-cols-2 gap-4 mb-10">
                <div class="bg-white/5 p-4 rounded">
                    <p class="text-[9px] text-gray-500 uppercase mb-1">Score</p>
                    <p id="finalScore" class="text-2xl font-display text-white">0</p>
                </div>
                <div class="bg-white/5 p-4 rounded">
                    <p class="text-[9px] text-gray-500 uppercase mb-1">Metrics</p>
                    <p id="finalStats" class="text-xs font-display text-white/60">--</p>
                </div>
            </div>
            
            <button onclick="closeWinModal()" class="w-full py-4 bg-gradient-to-r from-pink-600 to-purple-700 text-white font-display text-sm tracking-widest hover:brightness-125 transition-all">
                RETURN TO GRID
            </button>
        </div>
    </div>

    <!-- SVG ICONS -->
    <svg style="display: none;">
        <symbol id="icon-palm" viewBox="0 0 100 100"><path fill="currentColor" d="M50 90V50c0-5 10-25 30-30-15 15-15 25-10 35-10-10-15-5-20 5 5-20 0-30-15-45 5 15 0 30-10 40-5-10-15-15-25-10 15 5 25 20 25 35v40h25z"/></symbol>
        <symbol id="icon-sun" viewBox="0 0 100 100"><circle fill="currentColor" cx="50" cy="50" r="25"/><path stroke="currentColor" stroke-width="4" d="M50 10v10M50 80v10M10 50h10M80 50h10"/></symbol>
        <symbol id="icon-cassette" viewBox="0 0 100 100"><rect fill="none" stroke="currentColor" stroke-width="4" x="10" y="25" width="80" height="50"/><circle fill="currentColor" cx="35" cy="50" r="8"/><circle fill="currentColor" cx="65" cy="50" r="8"/></symbol>
        <symbol id="icon-diamond" viewBox="0 0 100 100"><path fill="currentColor" d="M50 10L90 50L50 90L10 50Z"/></symbol>
        <symbol id="icon-wave" viewBox="0 0 100 100"><path fill="none" stroke="currentColor" stroke-width="6" d="M10 60 Q 30 40 50 60 T 90 60"/></symbol>
        <symbol id="icon-computer" viewBox="0 0 100 100"><rect fill="none" stroke="currentColor" stroke-width="4" x="20" y="20" width="60" height="45"/><rect fill="currentColor" x="30" y="70" width="40" height="5"/></symbol>
        <symbol id="icon-heart" viewBox="0 0 100 100"><path fill="currentColor" d="M50 85C20 60 10 45 10 30 10 15 25 10 35 20 40 25 45 25 50 20 55 10 70 15 90 30 90 45 80 60 50 85Z"/></symbol>
        <symbol id="icon-pillar" viewBox="0 0 100 100"><rect fill="currentColor" x="35" y="20" width="30" height="60"/><rect fill="currentColor" x="30" y="15" width="40" height="5"/><rect fill="currentColor" x="30" y="80" width="40" height="5"/></symbol>
    </svg>

    <script>
        // --- LOGIC REMAINS UNCHANGED (Copied from previous state) ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSynth(freq, type, duration, vol = 0.1) {
            if (!audioCtx) audioCtx = new AudioCtx();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            flip: () => playSynth(400, 'triangle', 0.1),
            match: () => { playSynth(600, 'sine', 0.2); setTimeout(() => playSynth(900, 'sine', 0.3), 50); },
            fail: () => playSynth(150, 'sawtooth', 0.3, 0.05),
            win: () => { [440, 554, 659, 880].forEach((f, i) => setTimeout(() => playSynth(f, 'square', 0.5, 0.05), i * 100)); },
            hint: () => playSynth(1200, 'sine', 0.5, 0.05)
        };

        const iconTypes = ['palm', 'sun', 'cassette', 'diamond', 'wave', 'computer', 'heart', 'pillar'];
        const difficulties = {
            easy: { grid: 4, pairs: 8 },
            medium: { grid: 6, pairs: 18 },
            hard: { grid: 8, pairs: 32 }
        };

        let state = {
            diff: 'easy',
            cards: [],
            flipped: [],
            moves: 0,
            score: 0,
            combo: 1,
            lastMatchTime: 0,
            matchedPairs: 0,
            timer: 0,
            timerRef: null,
            hints: 3,
            isLocked: false
        };

        function setDifficulty(d) {
            state.diff = d;
            document.querySelectorAll('[data-diff]').forEach(b => b.classList.toggle('active', b.dataset.diff === d));
            initGame();
        }

        function initGame() {
            clearInterval(state.timerRef);
            state = { ...state, moves: 0, score: 0, combo: 1, matchedPairs: 0, timer: 0, hints: 3, flipped: [], isLocked: false };
            updateUI();
            
            const { grid, pairs } = difficulties[state.diff];
            const gameIcons = [];
            for(let i=0; i<pairs; i++) {
                const icon = iconTypes[i % iconTypes.length];
                gameIcons.push(icon, icon);
            }
            
            state.cards = gameIcons.sort(() => Math.random() - 0.5);
            renderGrid(grid);
            startTimer();
        }

        function renderGrid(size) {
            const container = document.getElementById('gameGrid');
            container.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            const screenW = window.innerWidth;
            const cardSize = Math.min(Math.floor((Math.min(screenW - 40, 600)) / size) - 8, 80);
            
            container.innerHTML = state.cards.map((icon, i) => `
                <div class="card-container" style="width:${cardSize}px; height:${cardSize}px">
                    <div class="card" data-id="${i}" data-icon="${icon}" onclick="handleFlip(this)">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front">
                            <svg class="w-1/2 h-1/2 text-cyan-400"><use href="#icon-${icon}"/></svg>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function handleFlip(cardEl) {
            if (state.isLocked || cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
            sounds.flip();
            cardEl.classList.add('flipped');
            state.flipped.push(cardEl);
            if (state.flipped.length === 2) checkMatch();
        }

        function checkMatch() {
            state.isLocked = true;
            state.moves++;
            const [c1, c2] = state.flipped;
            const isMatch = c1.dataset.icon === c2.dataset.icon;

            if (isMatch) {
                const now = Date.now();
                if (now - state.lastMatchTime < 2500) {
                    state.combo++;
                    showComboTag(c2);
                } else {
                    state.combo = 1;
                }
                state.lastMatchTime = now;
                state.score += (100 * state.combo);
                state.matchedPairs++;
                setTimeout(() => {
                    sounds.match();
                    c1.classList.add('matched');
                    c2.classList.add('matched');
                    state.flipped = [];
                    state.isLocked = false;
                    if (state.matchedPairs === difficulties[state.diff].pairs) endGame();
                }, 400);
            } else {
                state.combo = 1;
                setTimeout(() => {
                    sounds.fail();
                    c1.classList.add('shake');
                    c2.classList.add('shake');
                    setTimeout(() => {
                        c1.classList.remove('flipped', 'shake');
                        c2.classList.remove('flipped', 'shake');
                        state.flipped = [];
                        state.isLocked = false;
                    }, 400);
                }, 500);
            }
            updateUI();
        }

        function useHint() {
            if (state.hints <= 0 || state.isLocked) return;
            state.hints--;
            state.isLocked = true;
            sounds.hint();
            const unMatched = document.querySelectorAll('.card:not(.matched)');
            unMatched.forEach(c => c.classList.add('flipped'));
            setTimeout(() => {
                unMatched.forEach(c => { if (!state.flipped.includes(c)) c.classList.remove('flipped'); });
                state.isLocked = false;
                updateUI();
            }, 1000);
        }

        function startTimer() {
            state.timerRef = setInterval(() => {
                state.timer++;
                const mins = Math.floor(state.timer / 60).toString().padStart(2, '0');
                const secs = (state.timer % 60).toString().padStart(2, '0');
                document.getElementById('timer').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function updateUI() {
            document.getElementById('moves').textContent = state.moves;
            document.getElementById('score').textContent = state.score.toString().padStart(4, '0');
            document.getElementById('combo').textContent = `x${state.combo}`;
            const hintBtn = document.getElementById('hintBtn');
            hintBtn.textContent = `Flash_Hint (${state.hints})`;
            hintBtn.disabled = state.hints <= 0;
            hintBtn.style.opacity = state.hints <= 0 ? '0.3' : '1';
        }

        function showComboTag(el) {
            const tag = document.createElement('div');
            tag.id = 'combo-tag';
            tag.textContent = `X${state.combo}`;
            const rect = el.getBoundingClientRect();
            tag.style.left = `${rect.left + rect.width/2}px`;
            tag.style.top = `${rect.top}px`;
            document.body.appendChild(tag);
            setTimeout(() => tag.remove(), 800);
        }

        function endGame() {
            clearInterval(state.timerRef);
            sounds.win();
            const modal = document.getElementById('winModal');
            document.getElementById('finalScore').textContent = state.score;
            document.getElementById('finalStats').textContent = `${state.moves} Moves / ${document.getElementById('timer').textContent}`;
            modal.style.display = 'flex';
        }

        function closeWinModal() {
            document.getElementById('winModal').style.display = 'none';
            initGame();
        }

        document.body.addEventListener('click', () => { if(!audioCtx) audioCtx = new AudioCtx(); }, {once: true});
        initGame();
    </script>
</body>
</html>
