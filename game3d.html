<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combat Arena — 3D Wave Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0a0a1a; z-index: 999; color: #fff; font-family: 'Segoe UI', Arial, sans-serif;
      transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
    #loading .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #ff4444; border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-top: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .sub { color: rgba(255,255,255,0.4); font-size: 0.85rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div id="loading">
    <h1 style="color:#ff4444">⟳ COMBAT ARENA</h1>
    <div class="spinner"></div>
    <div class="sub">Loading assets...</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import { Game } from './js/game3d/main.js';

    const canvas = document.createElement('canvas');
    document.body.prepend(canvas);

    const loading = document.getElementById('loading');

    setTimeout(() => {
      const game = new Game(canvas);
      loading.classList.add('hidden');
      setTimeout(() => loading.remove(), 500);
      window.game = game;
    }, 300);
  </script>
</body>
</html>
