.search-bar-wrap {

.search-input {

.qb-med { background: rgba(245,158,11,0.12); color: #f59e0b; }

.qb-laravel { background: rgba(255,45,32,0.12); color: #ff6b5a; }

<script id="qData" type="application/json">[
{"id":1,"s":"laravel-basics","d":"easy","q":"What is Laravel?","a":"Laravel is an open-source PHP framework created by Taylor Otwell. It follows the MVC architectural pattern and includes features like Eloquent ORM, Blade templating, Artisan CLI, routing, queues, caching, and built-in authentication. The current major version is Laravel 13."},
{"id":2,"s":"laravel-basics","d":"easy","q":"What is Artisan?","a":"Artisan is Laravel's CLI tool that provides scaffolding commands like <code>make:model</code>, <code>make:controller</code>, <code>make:migration</code>, database management (<code>migrate</code>, <code>db:seed</code>), caching (<code>cache:clear</code>, <code>config:cache</code>), queue management, and more. Run <code>php artisan list</code> to see all commands."},
{"id":3,"s":"laravel-basics","d":"easy","q":"Explain the Laravel request lifecycle.","a":"1. Request enters <code>public/index.php</code> 2. Composer autoloader loads dependencies 3. App instance is created (service container) 4. Service providers are registered (<code>register()</code>) and booted (<code>boot()</code>) 5. Middleware pipeline runs (global + route middleware) 6. Route is matched and controller/dispatch is executed 7. Response is sent back through middleware pipeline 8. Terminable middleware runs after response is sent."},
{"id":4,"s":"laravel-basics","d":"med","q":"What is the service container?","a":"The service container is Laravel's dependency injection container. It manages class dependencies and performs automatic resolution using reflection. You can bind interfaces to concrete implementations using <code>$app->bind(Interface::class, Concrete::class)</code> or <code>$app->singleton()</code> for shared instances. Accessed via <code>resolve()</code>, <code>app()</code>, or type-hinting in constructors."},
{"id":5,"s":"laravel-basics","d":"med","q":"What are service providers?","a":"Service providers are the central bootstrapping mechanism in Laravel. Each provider has <code>register()</code> (called before all providers are loaded — only bind things) and <code>boot()</code> (called after all providers are registered — use services). Created with <code>php artisan make:provider</code>. Configured in <code>config/app.php</code> under the <code>providers</code> array."},
{"id":6,"s":"laravel-basics","d":"med","q":"What are facades?","a":"Facades provide a static-like interface to classes bound in the service container. For example, <code>Cache::get()</code> resolves to the underlying <code>CacheManager</code> instance via <code>__callStatic()</code>. Each facade extends <code>Illuminate\\Support\\Facades\\Facade</code> and defines <code>getFacadeAccessor()</code> returning the container binding key. Real-time facades (Laravel 8+) let you facade any class."},
{"id":7,"s":"laravel-basics","d":"med","q":"What is the difference between env() and config()?","a":"<code>env()</code> reads values directly from the <code>.env</code> file — use it only inside config files. <code>config()</code> reads the cached configuration — use it everywhere else in your application. After running <code>php artisan config:cache</code>, <code>env()</code> returns <code>null</code> for values outside config files, which is why application code must use <code>config()</code>."},
{"id":8,"s":"laravel-basics","d":"hard","q":"Explain the pipeline pattern used in Laravel middleware.","a":"The pipeline pattern passes an object (the request) through a chain of pipes (middleware classes). Each pipe can inspect, modify, or abort the pipeline. Implemented by <code>Illuminate\\Pipeline\\Pipeline</code>, it works by passing the object to the next pipe via a callback. Laravel uses this for HTTP middleware, queued job middleware, and mail sending. The pipeline allows adding/removing stages without changing the core logic."},
{"id":9,"s":"laravel-basics","d":"med","q":"What are the key structural changes in Laravel 11+?","a":"Laravel 11 introduced a simplified application skeleton with fewer generated files: no separate HTTP/Console Kernel classes (routes/middleware configured in <code>bootstrap/app.php</code>), no <code>App\\Exceptions\\Handler</code> (exception handling in <code>bootstrap/app.php</code>), merged <code>routes/console.php</code> into scheduler, default SQLite driver, and a component-first approach with streamlined service providers."},
{"id":10,"s":"laravel-basics","d":"hard","q":"What is php artisan optimize and when should you use it?","a":"<code>php artisan optimize</code> caches all framework bootstrapping files: config (<code>config:cache</code>), routes (<code>route:cache</code>), events (<code>event:cache</code>), and views (<code>view:cache</code>). Use it before production deployments. During development, use <code>php artisan optimize:clear</code> to clear all caches. The <code>optimize</code> command reduces application boot time by avoiding file reads on every request."},

{"id":11,"s":"laravel-basics","d":"easy","q":"Explain the complete request lifecycle flow in Laravel.","a":"A Laravel request flows through a well-defined path:<br><br><strong>Request Flow:</strong><br><code>Request → public/index.php → Bootstrap App → Service Providers → Middleware → Route → Controller → Service → Module → Database → Response</code><br><br>1. Request enters <code>public/index.php</code><br>2. Composer autoloader loads dependencies<br>3. App instance and service container are created<br>4. Service providers are registered (<code>register()</code>) and booted (<code>boot()</code>)<br>5. Request passes through middleware pipeline (global + route middleware)<br>6. Route is matched<br>7. Controller method or closure is executed<br>8. Services/modules interact with the database if needed<br>9. Response is sent back through middleware pipeline<br>10. Terminable middleware runs after response is sent."},
{"id":12,"s":"laravel-basics","d":"med","q":"How does the Laravel Service Container work?","a":"The <strong>Service Container</strong> is Laravel's dependency injection container and object management system. It is responsible for creating and resolving class objects automatically.<br><br>We register classes or interfaces in the Service Container using <code>bind()</code> or <code>singleton()</code> inside a Service Provider's <code>register()</code> method. Laravel automatically injects those dependencies into a class through constructor injection or method injection.<br><br><pre><code>// Binding in a Service Provider\n$this->app->bind(PaymentGateway::class, StripeGateway::class);\n$this->app->singleton(Logger::class, function ($app) {\n    return new FileLogger(storage_path('logs/laravel.log'));\n});</code></pre><br>Then Laravel auto-resolves via type-hinting:<br><pre><code>class OrderController {\n    public function __construct(\n        protected PaymentGateway $gateway\n    ) {}\n}</code></pre>"},
{"id":13,"s":"laravel-basics","d":"easy","q":"How do Middleware and Service Providers work together?","a":"<strong>Middleware</strong> works like a bridge between the request and the route. If the request is correct and the user has permission to access the route, it continues to the route handler. If not, it returns a response (like redirecting to login).<br><br><strong>Service Providers</strong> are Laravel's bootstrapping mechanism. Laravel ships with many default service providers like database, route, event, session, and mail — which load and make objects available across the entire application.<br><br>Each service provider has two methods:<br><ul><li><code>register()</code> — called before the application starts. Use it to bind things into the container only. Do not use any services here because they may not be loaded yet.</li><li><code>boot()</code> — called after all providers are registered. This is where you can use services, share data with views, register Blade directives, etc.</li></ul>The common use case for <code>boot()</code> is sharing data with views using <code>View::share('key', $value)</code>."},

{"id":14,"s":"eloquent","d":"easy","q":"What are the four types of Eloquent relationships?","a":"Eloquent supports four main relationship types:<br><br><ul><li><strong>One to One</strong> — One record belongs to one other record. Example: a User has one Profile. <code>User hasOne(Profile::class)</code></li><li><strong>One to Many</strong> — One parent has many child records. Example: a Blog Post has many Comments. <code>Post hasMany(Comment::class)</code></li><li><strong>Many to Many</strong> — Both tables can have multiple related records. Example: Users and Roles. <code>User belongsToMany(Role::class)</code></li><li><strong>Polymorphic</strong> — One model belongs to multiple model types. Example: Comments can belong to Posts or Videos. <code>Comment morphTo()</code>, <code>Post morphMany(Comment::class, 'commentable')</code></li></ul>"},
{"id":15,"s":"eloquent","d":"med","q":"Explain lazy loading vs eager loading with the N+1 problem.","a":"<strong>Lazy Loading:</strong> Relationships are loaded on-demand when accessed. If we have 1000 blog posts related to one user, using <code>User::all()</code> causes the N+1 problem — every time a user loads, their relation also loads:<br><br><pre><code>SELECT * FROM users;                    -- 1 query\n\nSELECT * FROM posts WHERE user_id=1;    -- N queries\nSELECT * FROM posts WHERE user_id=2;\nSELECT * FROM posts WHERE user_id=3;\n...</code></pre><br><strong>Eager Loading:</strong> If we use <code>User::with('posts')->get()</code>, it solves this problem and loads much faster by fetching all related data in just 2 queries:<br><br><pre><code>SELECT * FROM users;                    -- 1 query\n\nSELECT * FROM posts                     -- 1 query\nWHERE user_id IN (1,2,3,4,...1000);</code></pre><br>The N+1 problem happens when you query N items then access a relation per item, causing N extra SQL queries. Fix it by always using <code>with()</code> for eager loading in loops."},

{"id":16,"s":"transactions","d":"easy","q":"What is a database transaction and why is it important?","a":"A <strong>transaction</strong> is a group of SQL operations that are treated as a single unit of work. If all queries succeed, the transaction is committed. If any query fails, all previous changes are rolled back. This keeps the database consistent.<br><br>In Laravel, transactions are used like this:<br><pre><code>use Illuminate\\Support\\Facades\\DB;\n\nDB::beginTransaction();\n\ntry {\n    User::create(['name' => 'John']);\n    Order::create(['user_id' => 1, 'amount' => 100]);\n    \n    DB::commit();\n} catch (\\Exception $e) {\n    DB::rollBack();\n    throw $e;\n}</code></pre><br>Alternatively use the closure form: <code>DB::transaction(function () { ... })</code>."},
{"id":17,"s":"transactions","d":"med","q":"Explain ACID properties in database transactions.","a":"<strong>ACID</strong> stands for four essential properties of database transactions:<br><br><table class=\"table table-bordered\"><thead><tr><th>Property</th><th>Meaning</th></tr></thead><tbody><tr><td><strong>Atomicity</strong></td><td>All operations succeed or all fail — no partial execution</td></tr><tr><td><strong>Consistency</strong></td><td>Database remains in a valid state before and after the transaction, respecting all constraints</td></tr><tr><td><strong>Isolation</strong></td><td>Concurrent transactions don't interfere with each other</td></tr><tr><td><strong>Durability</strong></td><td>Once committed, data is permanent even after a system failure</td></tr></tbody></table><br>InnoDB (MySQL's default engine) fully supports ACID-compliant transactions."},

{"id":18,"s":"queues","d":"easy","q":"What is the difference between Queue, Redis, and Caching?","a":"<strong>Queue</strong> is used to run time-consuming tasks in the background, so the user doesn't have to wait. Example: sending emails, processing images, generating reports. Start the worker with <code>php artisan queue:work</code>.<br><br><strong>Redis</strong> stores data in RAM (memory), making it much faster than database queries. It is used as a queue driver, cache store, and session driver.<br><br><strong>Caching</strong> stores frequently used data temporarily so the application loads faster. Example using <code>Cache::remember()</code>:<br><pre><code>Cache::remember('users', 3600, function () {\n    return User::all();\n});</code></pre><br>This caches the users list for 1 hour (3600 seconds). Next request within that hour returns cached data instantly."},

{"id":19,"s":"api","d":"easy","q":"What are REST APIs and how do HTTP methods work?","a":"An <strong>API</strong> (Application Programming Interface) provides access to a database or part of application information using HTTP methods:<br><br><ul><li><strong>GET</strong> — used to read/retrieve data</li><li><strong>POST</strong> — used to send information and create new resources</li><li><strong>PATCH</strong> — used to update one or more fields of a resource (partial update)</li><li><strong>PUT</strong> — used to replace the entire resource (full update)</li><li><strong>DELETE</strong> — used to delete a resource</li></ul><br>Common HTTP status codes:<br><table class=\"table table-bordered\"><thead><tr><th>Code</th><th>Meaning</th></tr></thead><tbody><tr><td>200</td><td>Success</td></tr><tr><td>201</td><td>Created</td></tr><tr><td>204</td><td>No Content</td></tr><tr><td>400</td><td>Bad Request</td></tr><tr><td>401</td><td>Unauthorized</td></tr><tr><td>403</td><td>Forbidden</td></tr><tr><td>404</td><td>Not Found</td></tr><tr><td>500</td><td>Server Error</td></tr></tbody></table>"},
{"id":20,"s":"api","d":"easy","q":"What is the difference between Authentication and Authorization?","a":"<strong>Authentication</strong> asks \"Who are you?\" — it verifies identity (login, password, tokens). Laravel uses guards for authentication.<br><br><strong>Authorization</strong> asks \"What are you allowed to do?\" — it checks permissions (can edit, can delete). Laravel uses Gates and Policies for authorization.<br><br>Authentication happens first, authorization follows after identity is confirmed."},
{"id":21,"s":"api","d":"med","q":"Compare Sanctum vs Passport for API authentication.","a":"<strong>Sanctum</strong><br><ul><li>Simple and lightweight</li><li>Best for SPA (Single Page Apps) and Mobile APIs</li><li>Token-based authentication</li><li>Easy to set up (<code>php artisan install:api</code>)</li><li>Examples: React + Laravel, Vue + Laravel, Flutter App, Mobile App</li></ul><br><strong>Passport</strong><br><ul><li>Full OAuth2 implementation</li><li>Used for third-party authentication</li><li>Supports Access Tokens, Refresh Tokens, OAuth Clients</li><li>More complex setup</li><li>Best for third-party API access, multi-service architectures</li></ul><br>Laravel now defaults to Sanctum for most applications."},
{"id":22,"s":"routing","d":"med","q":"How do you implement rate limiting in Laravel?","a":"<strong>Rate limiting</strong> restricts how many API requests a user can make within a specific time to prevent abuse.<br><br>Define in <code>AppServiceProvider::boot()</code>:<br><pre><code>RateLimiter::for('api', fn ($job) => $job->limit(60)->minute());</code></pre><br>Apply to routes:<br><pre><code>Route::middleware('throttle:60,1')->group(function () {\n    // API Routes\n});</code></pre><br>The first parameter (60) is max attempts, the second (1) is the decay in minutes. Laravel also supports per-user and per-IP rate limiting."},
{"id":23,"s":"payment","d":"med","q":"Why use webhooks for payment integration?","a":"Webhooks receive the actual payment status from the payment gateway even if the user closes the browser or loses internet connectivity. When a user pays, the gateway sends a webhook to your server with the confirmed payment status.<br><br><strong>Why verify the webhook signature?</strong><br>To ensure the request genuinely came from the payment gateway and was not modified or forged. Without signature verification, attackers could send fake payment confirmations.<br><br><strong>Why use transactions during payment?</strong><br>Because updating the payment, order, and inventory should either all succeed or all roll back if an error occurs. Wrap payment logic in <code>DB::transaction(function () { ... })</code>."},

{"id":24,"s":"routing","d":"easy","q":"How do you define routes in Laravel?","a":"Routes are defined in <code>routes/web.php</code> (web routes, session, CSRF) and <code>routes/api.php</code> (API routes, prefix <code>/api</code>, no session). Syntax: <code>Route::get('/users', [UserController::class, 'index'])</code>. Methods: <code>get</code>, <code>post</code>, <code>put</code>, <code>patch</code>, <code>delete</code>, <code>options</code>. You can also use <code>Route::view()</code> for simple views and <code>Route::redirect()</code> for redirects."},
{"id":25,"s":"routing","d":"easy","q":"What are named routes?","a":"Named routes give a route a unique name for easy URL generation: <code>Route::get('/profile', [ProfileController::class, 'show'])->name('profile')</code>. Generate URLs with <code>route('profile', $params)</code> or <code>redirect()->route('profile')</code>. Named routes make the code resilient to URL changes — you only update the route definition."},
{"id":26,"s":"routing","d":"med","q":"What is route model binding?","a":"Route model binding automatically injects Eloquent models into controller methods based on route parameters. Implicit binding: <code>/users/{user}</code> fetches <code>User::findOrFail($id)</code>. Custom column: <code>/users/{user:slug}</code> fetches by <code>slug</code> column. Explicit binding: <code>Route::bind('user', fn($value) => User::where('slug', $value)->firstOrFail())</code> in a service provider."},
{"id":27,"s":"routing","d":"med","q":"What is middleware in Laravel?","a":"Middleware filters HTTP requests before they reach the route handler. Common middleware: <code>auth</code> (authentication check), <code>throttle</code> (rate limiting), <code>verified</code> (email verification), <code>cors</code>. Middleware can be applied globally (in <code>bootstrap/app.php</code>), to route groups (<code>Route::middleware('auth')->group(...)</code>), or to individual routes. Laravel 11+ configures middleware in <code>bootstrap/app.php</code>."},
{"id":28,"s":"routing","d":"easy","q":"How do you group routes?","a":"Use <code>Route::prefix('admin')->middleware('auth')->name('admin.')->group(function () { Route::get('/users', ...)->name('users'); });</code>. This creates routes prefixed with <code>/admin</code>, namespaced with <code>admin.users</code>, and applies the <code>auth</code> middleware. Groups can be nested, and support <code>prefix</code>, <code>middleware</code>, <code>name</code>, <code>domain</code>, and <code>controller</code> attributes."},
{"id":29,"s":"routing","d":"hard","q":"What is rate limiting and how do you implement it?","a":"Rate limiting restricts requests per time window to prevent abuse. Define limiters in <code>AppServiceProvider::boot()</code>: <code>RateLimiter::for('api', fn($job) => $job->limit(100)->minute())</code>. Apply via <code>throttle:api</code> middleware or <code>Route::middleware('throttle:60,1')</code>. RateLimiter supports per-user, per-IP limits, dynamic limits, and response headers (<code>X-RateLimit-Remaining</code>)."},
{"id":30,"s":"routing","d":"med","q":"What are signed URLs?","a":"Signed URLs are HMAC-signed URLs for one-time or time-limited access: <code>URL::signedRoute('unsubscribe', ['user' => 1])</code>. Verify with <code>$request->hasValidSignature()</code>. Temporary signed URLs: <code>URL::temporarySignedRoute('reset-password', now()->addHours(24), ['token' => $token])</code>. The signature is a hash of the URL query string and <code>APP_KEY</code>."},
{"id":31,"s":"routing","d":"med","q":"How does route caching work?","a":"<code>php artisan route:cache</code> serializes all routes into a single file for faster matching. It only works with controller-based routes (no closures). If you use closures or modify routes, you must re-cache. Laravel 11+ includes route caching as part of <code>php artisan optimize</code>. Clear with <code>php artisan route:clear</code>."},

{"id":32,"s":"blade","d":"easy","q":"What is Blade?","a":"Blade is Laravel's templating engine. Files use the <code>.blade.php</code> extension. It compiles to plain PHP cached in <code>storage/framework/views</code>. Key directives: <code>@if</code>, <code>@foreach</code>, <code>@yield</code>, <code>@section</code>, <code>@extends</code>, <code>@include</code>. No performance overhead since compiled views are cached until modified."},
{"id":33,"s":"blade","d":"easy","q":"How does Blade escape data?","a":"<code>{{ $var }}</code> auto-escapes using <code>htmlspecialchars()</code> to prevent XSS attacks. For raw (unescaped) output, use <code>{!! $var !!}</code> — but never use this with user-supplied data unless sanitized. For JavaScript contexts, use <code>@json($var)</code> which calls <code>json_encode()</code> safely."},
{"id":34,"s":"blade","d":"med","q":"How do Blade components work?","a":"Class-based components: <code>php artisan make:component Alert</code> creates a PHP class and paired Blade template. Render as <code><x-alert type=\"error\" /></code>. Components accept attributes, slots (<code>{{ $slot }}</code>), and named slots (<code><x-slot:header></code>). Anonymous components: just a Blade file in <code>resources/views/components/</code>. Laravel 11+ promotes a component-first approach."},
{"id":35,"s":"blade","d":"med","q":"What are stacks and pushes in Blade?","a":"<code>@push('scripts') ... @endpush</code> adds content to a named stack in child views. <code>@stack('scripts')</code> renders all pushed content in the layout. <code>@prepend</code> adds content to the beginning of the stack. Useful for child views to inject JS/CSS into the parent layout. Multiple pushes to the same stack are appended in order."},
{"id":36,"s":"blade","d":"hard","q":"How do custom Blade directives work?","a":"Register directives in a service provider's <code>boot()</code>: <code>Blade::directive('datetime', fn($expr) => \"<?php echo \\$expr->format('Y-m-d H:i:s'); ?>\")</code>. The callback returns raw PHP code that gets compiled. <code>Blade::if()</code> creates simple conditionals: <code>Blade::if('admin', fn() => auth()->user()?->isAdmin())</code>, used as <code>@admin</code>/<code>@endadmin</code>."},
{"id":37,"s":"blade","d":"med","q":"What is the difference between @yield and @section?","a":"<code>@yield('section')</code> defines a placeholder in a layout that child views fill using <code>@section('section') / @endsection</code>. <code>@section</code> can also define default content that child views can override. <code>@yield</code> is a one-way injection (parent defines where), while <code>@section/@show</code> allows the layout to provide default content."},

{"id":38,"s":"eloquent","d":"easy","q":"What is Eloquent ORM?","a":"Eloquent is Laravel's Active Record ORM. Each model maps to a database table (snake_case plural), each instance maps to a row, and each model property maps to a column. It provides CRUD operations, relationships, accessors/mutators, scopes, model events, and serialization. Models live in <code>app/Models/</code>."},
{"id":39,"s":"eloquent","d":"easy","q":"What are Eloquent naming conventions?","a":"Tables are snake_case plural (<code>users</code>, <code>post_categories</code>). Primary key is <code>id</code> (auto-increment). Foreign keys are <code>model_id</code> (<code>user_id</code>). Pivot tables are singular alphabetical (<code>category_user</code>). Timestamps are <code>created_at</code> and <code>updated_at</code>."},
{"id":40,"s":"eloquent","d":"med","q":"What relationships does Eloquent support?","a":"<strong>One-to-One:</strong> <code>hasOne()</code>/<code>belongsTo()</code>. <strong>One-to-Many:</strong> <code>hasMany()</code>/<code>belongsTo()</code>. <strong>Many-to-Many:</strong> <code>belongsToMany()</code> with pivot table. <strong>Has-Many-Through:</strong> <code>hasManyThrough()</code> for nested access. <strong>Polymorphic:</strong> <code>morphMany()</code>/<code>morphTo()</code> for multi-model relationships. <strong>Many-to-Many Polymorphic:</strong> <code>morphToMany()</code>/<code>morphedByMany()</code>."},
{"id":41,"s":"eloquent","d":"med","q":"What is the difference between lazy loading and eager loading?","a":"<strong>Lazy loading:</strong> relationships are loaded on-demand when accessed (<code>$user->posts</code>). This causes the N+1 problem — 1 query for users + N queries for each user's posts. <strong>Eager loading:</strong> relationships are loaded upfront using <code>User::with('posts')->get()</code>. This uses 2 queries total — 1 for users + 1 for posts with <code>WHERE user_id IN (...)</code>. Always use eager loading in loops."},
{"id":42,"s":"eloquent","d":"hard","q":"What is the N+1 problem and how do you fix it?","a":"The N+1 problem occurs when you fetch a collection of models and then access a relationship in a loop, causing an additional query per model. Example: <code>User::all()</code> (1 query) + <code>$user->posts</code> in a loop (N queries). Fix with eager loading: <code>User::with('posts')->get()</code> (2 queries total). Detect N+1 issues using <code>DB::enableQueryLog()</code> or Laravel Debugbar. Laravel 11+ can automatically warn about N+1 queries."},
{"id":43,"s":"eloquent","d":"med","q":"What are accessors and mutators?","a":"Accessors transform attribute values when retrieved: <code>protected function name(): Attribute { return Attribute::make(get: fn($v) => ucfirst($v)); }</code>. Mutators transform values when set: <code>Attribute::make(set: fn($v) => strtolower($v))</code>. In Laravel 11+, use the <code>Attribute</code> return type. Older syntax used <code>getNameAttribute()</code> methods."},
{"id":44,"s":"eloquent","d":"med","q":"What are Eloquent scopes?","a":"<strong>Local scopes:</strong> reusable query constraints defined as <code>scopePopular($query) { return $query->where('views', '>', 1000); }</code>. Used as <code>User::popular()->active()->get()</code>. <strong>Global scopes:</strong> apply constraints to all queries on a model using <code>addGlobalScope()</code>. Useful for multi-tenancy (<code>where('tenant_id', currentTenant())</code>)."},
{"id":45,"s":"eloquent","d":"hard","q":"Explain model events and observers.","a":"Eloquent fires lifecycle events: <code>retrieved</code>, <code>creating</code>, <code>created</code>, <code>updating</code>, <code>updated</code>, <code>saving</code>, <code>saved</code>, <code>deleting</code>, <code>deleted</code>, <code>restoring</code>, <code>restored</code>, <code>forceDeleting</code>, <code>forceDeleted</code>. Observers group event listeners: <code>php artisan make:observer UserObserver --model=User</code>. Register in <code>AppServiceProvider::boot()</code>: <code>User::observe(UserObserver::class)</code>."},
{"id":46,"s":"eloquent","d":"hard","q":"Explain polymorphic relationships with an example.","a":"Polymorphic relationships allow a model to belong to multiple other models on a single association. Example: Comments can belong to Posts and Videos. The <code>comments</code> table has <code>commentable_id</code> (INT) and <code>commentable_type</code> (STRING storing model class). Post uses <code>morphMany(Comment::class, 'commentable')</code>, Video uses the same. Comment uses <code>morphTo()</code>. This avoids separate comment tables per model."},
{"id":47,"s":"eloquent","d":"med","q":"What is paginate vs simplePaginate vs cursorPaginate?","a":"<code>paginate()</code>: returns items + pagination links (requires a count query) — best for small/medium datasets. <code>simplePaginate()</code>: only prev/next links (no count query) — faster but no page numbers. <code>cursorPaginate()</code>: offsetless pagination using a <code>WHERE</code> clause on ordered column <code>WHERE id > last_id</code> — best for large datasets, real-time data, and infinite scrolling."},
{"id":48,"s":"eloquent","d":"hard","q":"How do you optimize Eloquent queries for performance?","a":"1. Use <code>select()</code> for specific columns 2. Eager load relationships (<code>with()</code>) 3. Use <code>chunk()</code>/<code>chunkById()</code> for large datasets 4. Use <code>cursor()</code> (generator) for memory-efficient iteration 5. Use <code>when()</code> for conditional queries 6. Add DB indexes on foreign keys and frequently queried columns 7. Use <code>withCount()</code>/<code>withSum()</code> instead of loading full relationships 8. Use <code>whereHas()</code> instead of loading related models for filtering."},

{"id":49,"s":"migrations","d":"easy","q":"What are migrations?","a":"Migrations are version control for your database schema. Each migration file has <code>up()</code> (apply changes) and <code>down()</code> (rollback changes) methods. Create with <code>php artisan make:migration create_users_table</code>. Run with <code>php artisan migrate</code>. Laravel tracks which migrations have run in a <code>migrations</code> table."},
{"id":50,"s":"migrations","d":"easy","q":"What are seeders and factories?","a":"<strong>Seeders</strong> populate the database with test data: <code>php artisan make:seeder UserSeeder</code>. Run with <code>php artisan db:seed</code> or <code>DatabaseSeeder.php</code>. <strong>Factories</strong> generate fake model data using Faker: <code>php artisan make:factory UserFactory</code>. Use as <code>User::factory()->count(10)->create()</code>. Combine: <code>User::factory(10)->hasPosts(3)->create()</code>."},
{"id":51,"s":"migrations","d":"easy","q":"How do you rollback migrations?","a":"<code>php artisan migrate:rollback</code> rolls back the last batch. <code>migrate:rollback --step=3</code> rolls back 3 batches. <code>migrate:reset</code> rolls back all migrations. <code>migrate:refresh</code> rolls back then re-runs all migrations (drops data). <code>migrate:fresh</code> drops all tables and re-runs all migrations (fastest for clean slate)."},
{"id":52,"s":"migrations","d":"med","q":"What is the difference between fresh, refresh, and reset?","a":"<code>migrate:reset</code> rolls back every migration by calling each <code>down()</code> method. <code>migrate:refresh</code> runs reset then migrate again — preserves database. <code>migrate:fresh</code> drops all tables directly (no <code>down()</code> calls) and re-runs all migrations — fastest but skips rollback logic. Use <code>fresh</code> in development, <code>refresh</code> when you need proper rollbacks."},
{"id":53,"s":"migrations","d":"med","q":"How do you modify an existing column in a migration?","a":"Use Doctrine DBAL: add <code>doctrine/dbal</code> to composer.json. Then create a new migration: <code>Schema::table('users', function (Blueprint $table) { $table->string('name', 100)->change(); })</code> to modify column length. To rename: <code>$table->renameColumn('from', 'to')</code>. To drop: <code>$table->dropColumn('column_name')</code>. Always create a new migration instead of editing existing ones."},

{"id":54,"s":"transactions","d":"easy","q":"What is a database transaction?","a":"A transaction is a group of SQL operations treated as a single unit of work. If all operations succeed, the transaction is committed. If any operation fails, all changes are rolled back. This ensures data consistency — for example, creating a user and their order either both succeed or both fail."},
{"id":55,"s":"transactions","d":"med","q":"Explain ACID properties.","a":"<strong>Atomicity:</strong> all operations in the transaction succeed or all fail as a single unit. <strong>Consistency:</strong> the database remains in a valid state before and after the transaction, respecting all constraints. <strong>Isolation:</strong> concurrent transactions do not interfere with each other. <strong>Durability:</strong> once committed, changes persist even after a system failure."},
{"id":56,"s":"transactions","d":"med","q":"How do you use transactions in Laravel?","a":"<code>DB::transaction(function () { User::create([...]); Order::create([...]); });</code> — auto-commits on success, auto-rolls back on exception. Manual control: <code>DB::beginTransaction(); try { ... DB::commit(); } catch (Exception $e) { DB::rollBack(); throw $e; }</code>. Nesting: Laravel uses a counter-based approach that only commits on the outermost transaction."},
{"id":57,"s":"transactions","d":"hard","q":"What are database locks in Laravel?","a":"<strong>Shared locks</strong> (<code>sharedLock()</code>): prevents the selected rows from being updated until the transaction ends. <strong>Pessimistic locks</strong> (<code>lockForUpdate()</code>): prevents other transactions from reading or updating the selected rows. Use in payment processing to prevent double-charging: <code>DB::transaction(function () { $account = Account::lockForUpdate()->find(1); $account->balance -= 100; $account->save(); })</code>."},
{"id":58,"s":"transactions","d":"hard","q":"How does Laravel handle concurrent requests and race conditions?","a":"Use database transactions with pessimistic locking (<code>lockForUpdate()</code>) for critical operations. Use <code>DB::transaction()</code> with retries for deadlock resolution. Use queued jobs (sync processing) for long-running operations. Use atomic updates: <code>User::where('id', $id)->decrement('balance', 100)</code>. Use <code>CAS</code> (check-and-set) with cache locks for distributed systems."},

{"id":59,"s":"validation","d":"easy","q":"How does validation work in Laravel?","a":"Use <code>$request->validate([...])</code> in controllers. Laravel automatically redirects back with validation errors (<code>$errors</code>) for web routes or returns JSON errors for API routes. Custom error messages can be passed as the second argument. Laravel 11+ also supports validating directly in routes using <code>Route::get('/...', ...)->validate(...)</code>."},
{"id":60,"s":"validation","d":"easy","q":"What are Form Requests?","a":"Form Request classes encapsulate validation logic: <code>php artisan make:request StoreUserRequest</code>. Define <code>rules()</code> returning validation rules and <code>authorize()</code> for permission checks. Type-hint in controller: <code>public function store(StoreUserRequest $request)</code> — Laravel auto-validates before the controller method runs. Keeps controllers thin and validation reusable."},
{"id":61,"s":"validation","d":"med","q":"What are common Laravel validation rules?","a":"<code>required</code>, <code>email</code>, <code>unique:table,column</code>, <code>exists:table,column</code>, <code>min:x</code>/<code>max:x</code>, <code>confirmed</code> (matches <code>_confirmation</code> field), <code>file</code>/<code>image</code>, <code>regex:/pattern/</code>, <code>numeric</code>, <code>string</code>, <code>array</code>, <code>in:foo,bar</code>, <code>date</code>, <code>after:today</code>, <code>prohibited_if:field,value</code>, <code>required_with:foo</code>."},
{"id":62,"s":"validation","d":"med","q":"How do you create custom validation rules?","a":"<code>php artisan make:rule Uppercase</code>. The rule class implements <code>ValidationRule</code> with <code>validate(string $attribute, mixed $value, Closure $fail): void</code> — call <code>$fail('message')</code> on failure. Also supports closure rules: <code>Rule::unique('users')->where(fn($q) => $q->where('active', 1))</code>. Laravel 11+ uses the new <code>__invoke()</code> based rule signature."},
{"id":63,"s":"validation","d":"med","q":"What is the difference between validated() and all() or only() on a request?","a":"<code>$request->validated()</code> returns only the validated data (from Form Requests). <code>$request->all()</code> returns all input data including non-validated fields — a security risk if passed directly to mass-assignment. <code>$request->only(['name', 'email'])</code> returns only specified fields but without validation guarantee. Always use <code>validated()</code> or <code>safe()</code> (Laravel 11+) from Form Requests."},
{"id":64,"s":"validation","d":"hard","q":"How do you handle conditional validation?","a":"Use <code>required_if:field,value</code>, <code>required_with:foo</code>, <code>prohibited_if:field,value</code>, <code>exclude_if:field,value</code>, or closures: <code>'email' => Rule::requiredIf(fn() => request()->has('subscribe'))</code>. In Form Requests, override <code>prepareForValidation()</code> to normalize inputs before validation. Use <code>sometimes</code> rule to validate conditionally: <code>$validator->sometimes('reason', 'required', fn($input) => $input->status == 'rejected')</code>."},

{"id":65,"s":"authorization","d":"med","q":"What are Gates and Policies?","a":"<strong>Gates</strong> are closure-based authorization checks: <code>Gate::define('update-post', fn($user, $post) => $user->id === $post->user_id)</code>. <strong>Policies</strong> are classes that group authorization logic for a model: <code>php artisan make:policy PostPolicy --model=Post</code>. Use <code>$this->authorize('update', $post)</code> in controllers, <code>@can('update', $post)</code> in Blade, and <code>Gate::allows()</code> anywhere."},
{"id":66,"s":"authorization","d":"med","q":"What is the difference between authentication and authorization?","a":"<strong>Authentication</strong> answers \"who are you?\" — verifying identity (login, password, tokens). <strong>Authorization</strong> answers \"what are you allowed to do?\" — checking permissions (can edit, can delete). Laravel handles auth via guards and providers (config/auth.php), and authorization via Gates and Policies. Authentication happens first, authorization happens after."},
{"id":67,"s":"authorization","d":"easy","q":"What is Sanctum?","a":"Sanctum provides lightweight API token authentication. For SPAs, it uses cookie-based session authentication (same-site) — no token management needed. For mobile/third-party apps, it issues API tokens with abilities (scopes). <code>php artisan install:api</code> sets up Sanctum. Use <code>$user->createToken('token-name', ['read'])->plainTextToken</code> to issue tokens."},
{"id":68,"s":"authorization","d":"hard","q":"How do you implement role-based access control (RBAC) in Laravel?","a":"Create <code>roles</code> and <code>permissions</code> tables with a many-to-many relationship. Use a <code>Role</code> model with <code>belongsToMany(Permission::class)</code>. Use Gates: <code>Gate::define('manage-users', fn($user) => $user->hasPermissionTo('manage-users'))</code>. Cache permissions: <code>Gate::before(fn($user) => cache()->remember('permissions_'.$user->id, 3600, fn() => $user->getAllPermissions()))</code>. Use middleware: <code>Route::middleware('role:admin,super-admin')</code>."},

{"id":69,"s":"queues","d":"med","q":"How do queues work in Laravel?","a":"Queues defer time-consuming tasks (email sending, image processing, API calls) to background workers. Create a job: <code>php artisan make:job SendWelcomeEmail</code>. Dispatch: <code>SendWelcomeEmail::dispatch($user)</code> or <code>dispatch(new SendWelcomeEmail($user))</code>. Start worker: <code>php artisan queue:work</code>. Jobs implement <code>ShouldQueue</code> to be queued."},
{"id":70,"s":"queues","d":"easy","q":"What queue drivers does Laravel support?","a":"<strong>database</strong>: uses a MySQL/PostgreSQL table (good for simple setups). <strong>redis</strong>: uses Redis lists — fastest option, supports blocking pops. <strong>sqs</strong>: Amazon SQS for scalable cloud queueing. <strong>beanstalkd</strong>: simple work queue. <strong>sync</strong>: runs synchronously in the same request (for testing). <strong>null</strong>: discards jobs. In production, use Redis or SQS."},
{"id":71,"s":"queues","d":"med","q":"What is Redis and why is it used with Laravel?","a":"Redis is an in-memory data structure store used as a cache, queue driver, and session store. It stores data in RAM, making it much faster than database-backed alternatives. In Laravel, Redis powers: <code>cache</code> driver (fast key-value), <code>queue</code> driver (blocking pop for instant job processing), <code>session</code> driver (fast session reads), and can store broadcast data for WebSockets."},
{"id":72,"s":"queues","d":"med","q":"What are job batching and job chaining?","a":"<strong>Job batching:</strong> group jobs and track completion: <code>$batch = Bus::batch([...])->then(function() { ... })->catch(function() { ... })->finally(function() { ... })->dispatch()</code>. <strong>Job chaining:</strong> run jobs sequentially where each job waits for the previous: <code>ProcessPodcast::withChain([OptimizePodcast::class, ReleasePodcast::class])->dispatch()</code>. If one fails, the chain stops."},
{"id":73,"s":"queues","d":"med","q":"How do you handle failed jobs?","a":"Jobs that fail are stored in the <code>failed_jobs</code> table. Configure <code>QUEUE_FAILED_DRIVER</code> (database by default). Retry all failed: <code>php artisan queue:retry all</code>. Retry by ID: <code>php artisan queue:retry 5</code>. View failed: <code>php artisan queue:failed</code>. Delete failed: <code>php artisan queue:flush</code>. Define <code>failed()</code> method on job for custom failure handling."},
{"id":74,"s":"queues","d":"hard","q":"What is Laravel Horizon?","a":"Horizon provides a dashboard for managing Redis-based queues. It gives real-time metrics on jobs processed, failed, queue length, runtime, and throughput. It offers auto-scaling (balance queues across workers), configurable supervisord processes, and job tagging for filtering. Install via <code>composer require laravel/horizon</code>. Configure in <code>config/horizon.php</code>. Access via <code>/horizon</code>."},

{"id":75,"s":"caching","d":"med","q":"How does caching work in Laravel?","a":"Use <code>Cache::remember('key', $seconds, fn() => ...)</code> — stores the result of the closure for the given duration. Subsequent calls return the cached value without executing the closure. <code>Cache::rememberForever('key', fn() => ...)</code> stores permanently until deleted. <code>Cache::forget('key')</code> removes cached items. Use caching for expensive operations: database queries, API calls, computed views, configurations."},
{"id":76,"s":"caching","d":"easy","q":"What caching drivers does Laravel support?","a":"<strong>file</strong>: stores cache in <code>storage/framework/cache/</code> (good for development). <strong>redis</strong>/<strong>memcached</strong>: in-memory caching (best for production). <strong>database</strong>: stores in a database table. <strong>dynamodb</strong>: AWS DynamoDB for serverless setups. <strong>array</strong>: per-request caching (for testing). <strong>null</strong>: disables caching. Configure in <code>config/cache.php</code>. Prefer Redis for production."},
{"id":77,"s":"caching","d":"med","q":"What are cache tags?","a":"Cache tags allow grouping related cache items. <code>Cache::tags(['posts', 'comments'])->put('post_1', $post, 3600)</code>. Flush all items in a tag group: <code>Cache::tags(['posts'])->flush()</code>. Only supported by Redis and Memcached drivers — file and database drivers ignore tags. Ideal for invalidating related caches when data changes, like clearing all post-related caches when a post updates."},
{"id":78,"s":"caching","d":"hard","q":"What caching strategies do you use in production?","a":"<strong>Full-page cache:</strong> cache entire responses for unauthenticated pages using Varnish or Nginx fastcgi_cache. <strong>Query cache:</strong> <code>Cache::remember('users.active', 3600, fn() => User::active()->get())</code>. <strong>Fragment cache:</strong> cache partial view sections. <strong>OPCache:</strong> cache compiled PHP opcodes. <strong>Redis:</strong> session storage, queue backend, application cache. <strong>CDN:</strong> static assets (CSS, JS, images). <strong>Browser cache:</strong> <code>Cache-Control</code> headers for assets."},

{"id":79,"s":"api","d":"easy","q":"How do you create an API in Laravel?","a":"Define routes in <code>routes/api.php</code> (automatically prefixed with <code>/api</code>). Return JSON responses: <code>return response()->json(['data' => $user], 200)</code> or <code>return UserResource::collection($users)</code>. Use Sanctum for authentication. Laravel 11+ includes <code>php artisan install:api</code> to scaffold API routes, Sanctum, and rate limiting."},
{"id":80,"s":"api","d":"med","q":"What are API Resources?","a":"API Resources transform Eloquent models into JSON responses. <code>php artisan make:resource UserResource</code>. Define <code>toArray($request)</code> to control the output structure. Use <code>UserResource::make($user)</code> for single models, <code>UserResource::collection($users)</code> for collections. Conditionally include attributes with <code>when()</code>, merge relations with <code>whenLoaded()</code>, and add metadata with <code>additional()</code>."},
{"id":81,"s":"api","d":"easy","q":"Explain REST API principles and HTTP methods.","a":"REST (Representational State Transfer) principles: stateless, resource-based URLs (<code>/api/users/123</code>), standard HTTP methods — <strong>GET</strong> (read), <strong>POST</strong> (create), <strong>PUT</strong> (replace entire resource), <strong>PATCH</strong> (partial update), <strong>DELETE</strong> (remove). Use JSON for data exchange, leverage HTTP status codes for responses, and version your APIs (<code>/api/v1/users</code>)."},
{"id":82,"s":"api","d":"easy","q":"What are common HTTP status codes?","a":"<strong>200</strong> OK (successful GET/PATCH), <strong>201</strong> Created (successful POST), <strong>204</strong> No Content (successful DELETE), <strong>400</strong> Bad Request (validation errors), <strong>401</strong> Unauthorized (not logged in), <strong>403</strong> Forbidden (no permission), <strong>404</strong> Not Found, <strong>422</strong> Unprocessable Entity (validation), <strong>429</strong> Too Many Requests (rate limit), <strong>500</strong> Server Error."},
{"id":83,"s":"api","d":"med","q":"Sanctum vs Passport — when to use which?","a":"<strong>Sanctum</strong>: lightweight token-based auth for SPAs (cookie-based) and mobile apps (token-based). Easy setup, no OAuth complexity, ideal for first-party apps. <strong>Passport</strong>: full OAuth2 implementation with access tokens, refresh tokens, and OAuth clients. Use for third-party API access, multi-service architectures, or when you need OAuth2 scopes. Laravel now defaults to Sanctum."},
{"id":84,"s":"api","d":"hard","q":"How do you secure APIs in production?","a":"1. Use HTTPS everywhere 2. Authenticate with Sanctum/Passport 3. Rate limit with <code>throttle</code> middleware 4. Validate all input 5. Use API Resources for consistent JSON structure 6. Set CORS properly 7. Version your APIs (<code>/api/v1</code>) 8. Log all requests for audit trails 9. Use <code>X-RateLimit</code> headers 10. Encrypt sensitive payloads 11. Use <code>can:ability</code> middleware for fine-grained authorization 12. Implement request signing for webhooks."},
{"id":85,"s":"api","d":"med","q":"What is JWT authentication?","a":"JWT (JSON Web Token) is a stateless authentication method using self-contained tokens. The token contains a header, payload (user claims), and signature (verified with server secret). No server-side session storage needed — the token carries all user info. In Laravel, use <code>tymon/jwt-auth</code> package. Tokens are sent in the <code>Authorization: Bearer {token}</code> header. JWT is good for mobile apps and distributed systems."},

{"id":86,"s":"payment","d":"med","q":"Why use webhooks for payment processing?","a":"Webhooks receive the actual payment status from the payment gateway even if the user closes the browser or loses internet connectivity. When a user pays, the gateway sends a webhook to your server with the confirmed status. This is critical because the frontend can be unreliable — a user might close the tab after being redirected to the gateway. Webhooks ensure your system has an authoritative record of payment status."},
{"id":87,"s":"payment","d":"med","q":"Why verify webhook signatures?","a":"Webhook signatures ensure the request genuinely came from the payment gateway and was not modified or forged. Without verification, attackers could pretend to be the gateway and send fake payment confirmations. Each gateway provides a secret key to generate and verify an HMAC signature. Always verify: <code>$gateway->verifySignature($payload, $signature)</code> before processing any webhook."},
{"id":88,"s":"payment","d":"med","q":"Why use DB transactions during payment processing?","a":"Updating payment status, order status, and inventory should all succeed or all roll back together. Without transactions, a failure after updating the payment but before updating inventory would leave inconsistent data. Wrap payment logic in <code>DB::transaction(function () { ... })</code> so that if any step fails, all changes are reverted and the user can retry safely."},
{"id":89,"s":"payment","d":"hard","q":"How do you handle duplicate webhooks (idempotency)?","a":"Payment gateways may send the same webhook multiple times (network retries). Store a unique event ID from the webhook payload in a database table with a unique constraint. Before processing, check if the event ID has already been processed: <code>if (WebhookEvent::where('event_id', $id)->exists()) { return response('OK', 200); }</code>. This ensures idempotency — processing the same webhook multiple times has only one effect."},
{"id":90,"s":"payment","d":"hard","q":"What is idempotency and why does it matter in payments?","a":"Idempotency means making the same request multiple times produces the same result as making it once. In payment APIs, if a client sends a charge request and times out (but the charge actually succeeded), retrying could charge the user twice. Use idempotency keys: <code>Stripe::setIdempotencyKey('unique-key')</code>. The gateway sees the same key and returns the previous response instead of processing again."},

{"id":91,"s":"events","d":"med","q":"What are events and listeners in Laravel?","a":"Events decouple side effects from your core logic. Define an event: <code>php artisan make:event UserRegistered</code>. Define a listener: <code>php artisan make:listener SendWelcomeEmail --event=UserRegistered</code>. Dispatch: <code>event(new UserRegistered($user))</code>. Map in <code>EventServiceProvider</code> or use auto-discovery. Listeners can implement <code>ShouldQueue</code> to run asynchronously. This keeps controllers clean and makes side effects testable."},
{"id":92,"s":"events","d":"med","q":"What is broadcasting and Laravel Echo?","a":"Broadcasting pushes real-time events from the server to connected clients via WebSockets. Define: <code>php artisan make:event OrderShipped --broadcast</code>. The event implements <code>ShouldBroadcast</code>. On the frontend, Laravel Echo subscribes: <code>Echo.channel('orders').listen('OrderShipped', (e) => { ... })</code>. Broadcasting uses channels (public, private, presence) and drivers (Reverb, Pusher, Soketi)."},
{"id":93,"s":"events","d":"med","q":"What is Laravel Reverb?","a":"Reverb is a first-party WebSocket server introduced in Laravel 11. It's a native Laravel WebSocket solution replacing Pusher for self-hosted apps. Fast, scalable, and integrated with Laravel's broadcasting system. Start with <code>php artisan reverb:start</code>. Configuration in <code>config/reverb.php</code>. Supports private channels, presence channels, and scales horizontally with Redis."},
{"id":94,"s":"events","d":"med","q":"What are private channels in broadcasting?","a":"Private channels restrict broadcasting to authenticated users. Use <code>Echo.private('orders.' + orderId)</code> on the frontend. Define authorization in <code>routes/channels.php</code>: <code>Broadcast::channel('orders.{order}', fn($user, $orderId) => $user->id === Order::find($orderId)->user_id)</code>. Private channels ensure only authorized users receive updates for their resources."},
{"id":95,"s":"events","d":"hard","q":"What is the difference between events, listeners, and queues?","a":"<strong>Events + Listeners:</strong> an event is fired, all registered listeners handle it synchronously (default). <strong>Events + Queued Listeners:</strong> listeners implement <code>ShouldQueue</code> and the handling runs in a background queue worker — the HTTP response is not delayed. <strong>Queues (Jobs):</strong> standalone dispatchable jobs that don't require an event. Use events when multiple unrelated listeners should react to the same occurrence. Use jobs for single async tasks."},

{"id":96,"s":"testing","d":"easy","q":"What is Pest PHP?","a":"Pest is a testing framework built on top of PHPUnit with cleaner, more expressive syntax. It's the default in Laravel 11+. Example: <code>test('users can create posts', fn() => actingAs($user)->post('/posts', $data)->assertCreated())</code>. Supports higher-order expectations (<code>expect($response)->toBeOk()</code>), arch testing, and dataset-driven tests. Install via <code>composer require pestphp/pest --dev</code>."},
{"id":97,"s":"testing","d":"med","q":"How do you test HTTP endpoints in Laravel?","a":"Use <code>$this->get('/api/users')</code>, <code>post('/api/users', $data)</code>, <code>put('/api/users/1', $data)</code>, <code>delete('/api/users/1')</code>. Assertions: <code>->assertStatus(200)</code>, <code>->assertJsonStructure(['data' => ['id', 'name']])</code>, <code>->assertJsonCount(15, 'data')</code>, <code>->assertSee('User Name')</code>. Authenticate with <code>actingAs($user)</code>. Pest: <code>get('/api/users')->assertOk()->assertJsonStructure([...])</code>."},
{"id":98,"s":"testing","d":"med","q":"What is the difference between unit tests and feature tests?","a":"<strong>Unit tests</strong>: test a single class or method in isolation. Fast, no database or framework boot needed. Mock dependencies. Example: testing a <code>TaxCalculator</code> class. <strong>Feature tests</strong>: test a complete feature end-to-end (request → route → controller → database → response). Slower but more valuable for integration. Example: testing user registration flow. In Laravel, both use PHPUnit/Pest, but feature tests extend <code>TestCase</code>."},
{"id":99,"s":"testing","d":"hard","q":"How do you mock dependencies in tests?","a":"Use Laravel's <code>Mockery</code> integration. <code>$this->mock(StripeService::class, fn($mock) => $mock->shouldReceive('charge')->once()->andReturn(true))</code>. Partial mocks: <code>$this->partialMock(...)</code>. For facades: <code>Cache::shouldReceive('get')->once()->andReturn($data)</code>. For HTTP: <code>Http::fake(['stripe.com/*' => Http::response(['ok' => true], 200)])</code>. Always mock external services in tests to avoid real API calls."},

{"id":100,"s":"security","d":"easy","q":"How does Laravel prevent SQL injection?","a":"Eloquent uses PDO parameter binding internally, which automatically escapes values. For raw queries, always use parameter binding: <code>DB::select('SELECT * FROM users WHERE email = ?', [$email])</code> or named bindings: <code>DB::select('SELECT * FROM users WHERE email = :email', ['email' => $email])</code>. Never use string interpolation: <code>\"WHERE id = $id\"</code> — this is vulnerable to injection."},
{"id":101,"s":"security","d":"easy","q":"How does CSRF protection work?","a":"Laravel generates a CSRF token per session stored in the session. For every POST/PUT/PATCH/DELETE request, Blade's <code>@csrf</code> directive adds a hidden <code>_token</code> field. The <code>VerifyCsrfToken</code> middleware compares the submitted token with the session token. If they don't match, Laravel throws a <code>TokenMismatchException</code>. Exclude specific routes (like webhooks) in <code>VerifyCsrfToken::$except</code>."},
{"id":102,"s":"security","d":"med","q":"How does Laravel prevent XSS attacks?","a":"Blade's <code>{{ $var }}</code> syntax automatically calls <code>htmlspecialchars()</code> to escape HTML characters. Never use <code>{!! $var !!}</code> (unescaped output) with user-supplied data unless sanitized with HTML Purifier or similar. Use CSP (Content Security Policy) headers as defense-in-depth. Laravel also escapes JSON in <code>@json</code> directive."},
{"id":103,"s":"security","d":"med","q":"What are .env file best practices?","a":"Never commit <code>.env</code> to version control — use <code>.env.example</code> as a template. Production settings: <code>APP_DEBUG=false</code>, <code>APP_ENV=production</code>, generate a strong <code>APP_KEY</code> (<code>php artisan key:generate</code>). Restrict file permissions (<code>chmod 600 .env</code>). Use different keys and credentials per environment. Rotate API keys regularly. For sensitive production data, use environment variables instead of .env files."},
{"id":104,"s":"security","d":"med","q":"How does encryption work in Laravel?","a":"Laravel uses AES-256-CBC (or AES-256-GCM in newer versions) encryption via <code>Crypt::encrypt($data)</code> and <code>Crypt::decrypt($data)</code>. It uses the <code>APP_KEY</code> from <code>.env</code>. Encrypted data includes an HMAC signature for integrity verification (tamper detection). Use for sensitive data like API tokens, personal information, or webhook secrets stored in the database."},

{"id":105,"s":"performance","d":"hard","q":"How do you optimize a slow Laravel application?","a":"1. Enable OPCache (cache PHP bytecode) 2. Run <code>php artisan optimize</code> for production 3. Use eager loading to fix N+1 queries 4. Add database indexes on foreign keys and WHERE columns 5. Use Redis for caching and sessions 6. Queue slow processes (email, image processing) 7. Use chunking for large dataset operations 8. Monitor query logs and slow queries 9. Use Laravel Debugbar in development 10. Implement response caching for API endpoints 11. Upgrade PHP version (PHP 8.4 is significantly faster)."},
{"id":106,"s":"performance","d":"hard","q":"What is Laravel Octane and how does it work?","a":"Octane serves Laravel in-memory using high-performance application servers like Swoole or RoadRunner. The app boots once and handles thousands of requests per second without re-booting. Run <code>php artisan octane:start --server=swoole</code>. Must avoid: stateful singletons, static properties that change per-request, writing to local file system (use cloud storage), and closures that capture request-bound state. Octane can achieve 10-50x throughput improvements."},
{"id":107,"s":"performance","d":"med","q":"What are common Laravel performance bottlenecks?","a":"1. N+1 queries (loop-loaded relationships) 2. Missing database indexes 3. <code>SELECT *</code> with unnecessary columns 4. Loading large collections into memory (<code>all()</code> without <code>chunk()</code>) 5. Not caching expensive operations 6. Slow views with unoptimized Blade loops 7. Synchronous email/notification sending 8. Not using pagination 9. Large JSON responses without API Resources 10. Unoptimized images on file uploads 11. Too many service providers or middleware."},

{"id":108,"s":"new-features","d":"med","q":"What are the new features in Laravel 11?","a":"Laravel 11 introduces: simplified application skeleton (no Kernel/Handler files), <code>SQLite</code> as default database, <code>php artisan install:api</code> and <code>install:broadcasting</code> commands, health routing (<code>/up</code> endpoint), per-second rate limiting, automatic password rehashing, <code>once()</code> helper for memoization, <code>Model::preventSilentlyDiscardingAttributes()</code>, <code>whenQueryingForLongerThan()</code> for N+1 detection, and streamlined <code>bootstrap/app.php</code> configuration."},
{"id":109,"s":"new-features","d":"med","q":"What is Laravel Pennant?","a":"Pennant is Laravel's first-party feature flag package. Define features: <code>Feature::define('pipeline-deals', fn($user) => $user->isInternal())</code>. Check in code: <code>Feature::active('pipeline-deals')</code>. In Blade: <code>@feature('pipeline-deals')</code>. Supports percentage rollouts, user segments, A/B testing, and persistent storage drivers (array, database, Redis). Install via <code>composer require laravel/pennant</code>."},
{"id":110,"s":"new-features","d":"hard","q":"What is the Laravel AI SDK?","a":"Laravel 13 introduces a first-party AI SDK for integrating with LLMs (OpenAI, Anthropic, Ollama). It provides a unified interface for chat completions, embeddings, and streaming responses. Use <code>AI::chat()->create([...])</code> for completions, <code>AI::embeddings()->create([...])</code> for embeddings. Supports tool calling (function calling), multi-modal inputs, and streaming. Configure providers in <code>config/ai.php</code>."},
{"id":111,"s":"new-features","d":"med","q":"What is Laravel Pulse?","a":"Pulse is Laravel's real-time application monitoring dashboard. It provides insights into: slow requests (<code>Pulse::record('slow-request', ...)</code>), slow jobs, slow queries, cache usage, exceptions, and custom records. Data is aggregated every minute and stored in a database table. Install: <code>composer require laravel/pulse</code>. Access via <code>/pulse</code>. Uses Livewire and Alpine.js for real-time updates."},

{"id":112,"s":"deployment","d":"med","q":"How do you deploy a Laravel application to production?","a":"1. <code>composer install --no-dev --optimize-autoloader</code> 2. <code>php artisan optimize</code> (caches config, routes, events, views) 3. Run migrations: <code>php artisan migrate --force</code> 4. Set permissions: <code>storage/</code> and <code>bootstrap/cache/</code> writable 5. Configure queue worker: <code>php artisan queue:work --daemon</code> (use Supervisor) 6. Set up cron: <code>* * * * * php artisan schedule:run</code> 7. Configure web server (Nginx/FPM or Apache). Tools: Laravel Forge (VPS management), Vapor (serverless), Envoyer (zero-downtime deployment)."},
{"id":113,"s":"deployment","d":"med","q":"What is Laravel Vapor?","a":"Vapor is a serverless deployment platform for Laravel powered by AWS Lambda. You pay per-request instead of paying for always-on servers. It auto-scales to zero (no cost when idle) and handles millions of requests. Upload via <code>vapor deploy</code> CLI command. Downside: cold starts on infrequently accessed endpoints, file storage must use S3, session must be external (DynamoDB/Redis), and 15-minute Lambda execution limit."},
{"id":114,"s":"deployment","d":"hard","q":"What are common Laravel deployment mistakes?","a":"1. Not running <code>php artisan optimize</code> in production 2. Debug mode left on (<code>APP_DEBUG=true</code>) 3. Committing <code>.env</code> with sensitive credentials 4. Missing queue worker for async jobs 5. Not migrating before deploying new code 6. File permissions too permissive (777) 7. Not using a CDN for static assets 8. Not monitoring with Pulse/other tools 9. Forgetting Supervisor to keep queue workers alive 10. No rollback strategy 11. Session file driver on multi-server setups (use Redis/Database) 12. Not testing deployment locally first."},

{"id":115,"s":"laravel-basics","d":"hard","q":"What is the difference between bind(), singleton(), and scoped() in the container?","a":"<code>bind()</code> creates a new instance every time the class is resolved. <code>singleton()</code> creates one instance that is shared across the entire application. <code>scoped()</code> (Laravel 11+) creates one instance per request/job scope — useful for services like <code>CurrentUser</code> that should be consistent within a single request but different between requests."},
{"id":116,"s":"laravel-basics","d":"med","q":"What is the once() helper?","a":"<code>once()</code> (Laravel 11+) memoizes a value for the current request scope. <code>$user = once(fn() => User::find($id))</code> — subsequent calls within the same request return the cached value without executing the query. Useful for expensive operations called multiple times (e.g., <code>auth()->user()</code> lookups). The memoized value is cleared between requests automatically."},
{"id":117,"s":"queues","d":"med","q":"How do you dispatch jobs from scheduled tasks?","a":"Use the scheduler in <code>routes/console.php</code>: <code>Schedule::job(new ProcessPendingNotifications)->everyMinute()</code>. Or chain: <code>Schedule::call(fn() => SendReportJob::dispatch())->dailyAt('23:00')</code>. Run <code>php artisan schedule:run</code> every minute in your cron: <code>* * * * * php /path/to/artisan schedule:run</code>. Laravel Horizon can also schedule recurring jobs."},
{"id":118,"s":"eloquent","d":"hard","q":"How does mass assignment protection work in Laravel?","a":"Mass assignment protection prevents users from setting arbitrary model attributes via request input. Define <code>protected $fillable = ['name', 'email']</code> to whitelist safe attributes, or <code>protected $guarded = ['is_admin']</code> to blacklist sensitive attributes. Use <code>Model::unguard()</code> cautiously (e.g., in seeders). Always use <code>$request->validated()</code> from Form Requests instead of <code>$request->all()</code> to ensure only validated fields are mass-assigned."}
]</script>

<script>
const STORAGE_KEY = 'lv_progress';
const EL = (s, p) => (p||document).querySelector(s);
const ELS = (s, p) => (p||document).querySelectorAll(s);
const SECTION_NAMES = {
  'laravel-basics':'Laravel Basics','routing':'Routing & Controllers','blade':'Blade & Views','eloquent':'Eloquent ORM',
  'migrations':'Migrations & Seeding','transactions':'Transactions & ACID','validation':'Validation & Form Requests',
  'authorization':'Authentication & Authorization','queues':'Queues, Jobs & Redis','caching':'Caching Strategies',
  'api':'REST APIs & Sanctum','payment':'Payment & Webhooks','events':'Events, Broadcasting & Reverb',
  'testing':'Testing (Pest/PHPUnit)','security':'Security & Encryption','performance':'Performance & Octane',
  'new-features':'Laravel 11+ Features','deployment':'Deployment & Devops'
};
const SECTION_PARENT = {
  'laravel-basics':'basics','routing':'basics','blade':'basics','eloquent':'eloquent','migrations':'eloquent',
  'transactions':'database','validation':'auth','authorization':'auth','queues':'advanced','caching':'advanced',
  'api':'advanced','payment':'advanced','events':'advanced','testing':'advanced','security':'advanced',
  'performance':'advanced','new-features':'advanced','deployment':'advanced'
};
const PARENT_LABELS = {basics:'Core Laravel',eloquent:'Database & Eloquent',database:'Transactions & DB',auth:'Validation & Auth',advanced:'Advanced Topics'};
const SECTION_DESCS = {
  'laravel-basics':'Laravel fundamentals — request lifecycle, service container, facades, Artisan, and architecture.',
  'routing':'Route definitions, middleware, named routes, route model binding, rate limiting, and caching.',
  'blade':'Blade templating — directives, components, slots, stacks, and rendering optimization.',
  'eloquent':'Eloquent ORM — relationships, eager/lazy loading, N+1, accessors, scopes, events, and performance.',
  'migrations':'Schema versioning, rollbacks, seeders, factories, and column modifications.',
  'transactions':'Database transactions, ACID properties, locking, and concurrent request handling.',
  'validation':'Validation rules, Form Requests, custom rules, conditional validation, and error handling.',
  'authorization':'Authentication (Sanctum/Passport), authorization (Gates/Policies), and RBAC.',
  'queues':'Queue drivers, jobs, batching, chaining, failed jobs, Redis, and Horizon.',
  'caching':'Cache drivers, remembering, tags, strategies, and OPCache.',
  'api':'RESTful API design, API Resources, Sanctum, JWT, HTTP methods, status codes, and API security.',
  'payment':'Payment gateway integration, webhooks, signatures, idempotency, and Stripe.',
  'events':'Events, listeners, broadcasting, Reverb, private channels, and real-time features.',
  'testing':'Pest PHP, HTTP tests, unit vs feature tests, mocking, and TDD practices.',
  'security':'SQL injection prevention, CSRF, XSS, encryption, .env security, and best practices.',
  'performance':'Query optimization, caching, Octane, common bottlenecks, and profiling.',
  'new-features':'Laravel 11+ features — Pennant, Pulse, AI SDK, streamlined skeleton, and improvements.',
  'deployment':'Production deployment, Forge, Vapor, Envoyer, cron, queue workers, and common mistakes.'
};
const SECTION_ICONS = {
  'laravel-basics':'bi-lightning-charge-fill','routing':'bi-signpost-2','blade':'bi-eye','eloquent':'bi-database',
  'migrations':'bi-arrow-up-circle','transactions':'bi-arrow-repeat','validation':'bi-check2-square',
  'authorization':'bi-shield-lock','queues':'bi-cpu','caching':'bi-speedometer2',
  'api':'bi-globe','payment':'bi-credit-card','events':'bi-broadcast',
  'testing':'bi-check-circle','security':'bi-shield-check','performance':'bi-graph-up-arrow',
  'new-features':'bi-stars','deployment':'bi-cloud-upload'
};
const SECTION_ORDER = ['laravel-basics','routing','blade','eloquent','migrations','transactions','validation','authorization','queues','caching','api','payment','events','testing','security','performance','new-features','deployment'];

let questions = [];
let filtered = [];
let progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let searchTerm = '';
let diffFilter = 'all';
let tabFilter = 'all';

function init() {
  const data = document.getElementById('qData');
  questions = JSON.parse(data.textContent);
  rebuild();
  renderTabs();
  document.getElementById('tabBar').addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    ELS('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    tabFilter = tab.dataset.tab;
    rebuild();
  });
  document.getElementById('downloadBtn').addEventListener('click', e => {
    e.preventDefault();
    downloadTxt();
  });
}

function rebuild() {
  applyFilters();
  renderSidebar();
  renderContent();
  updateStats();
}

function applyFilters() {
  filtered = questions.filter(q => {
    if (tabFilter !== 'all' && SECTION_PARENT[q.s] !== tabFilter) return false;
    if (diffFilter !== 'all' && q.d !== diffFilter) return false;
    if (searchTerm) {
      const t = searchTerm.toLowerCase();
      const match = q.q.toLowerCase().includes(t);
      if (!match) return false;
    }
    return true;
  });
}

function renderTabs() {
  const bar = document.getElementById('tabBar');
  const counts = {all: questions.length};
  Object.keys(PARENT_LABELS).forEach(k => counts[k] = questions.filter(q => SECTION_PARENT[q.s] === k).length);
  let html = `<span class="tab active" data-tab="all">All <span class="tab-count">${counts.all}</span></span>`;
  Object.keys(PARENT_LABELS).forEach(k => {
    html += `<span class="tab" data-tab="${k}">${PARENT_LABELS[k]} <span class="tab-count">${counts[k]}</span></span>`;
  });
  bar.innerHTML = html;
}

function downloadTxt() {
  let txt = '=== Laravel Interview Questions ===\n';
  txt += `Total Questions: ${questions.length}\n\n`;
  SECTION_ORDER.forEach(s => {
    const qs = questions.filter(q => q.s === s);
    if (!qs.length) return;
    txt += `\n--- ${SECTION_NAMES[s]} (${qs.length} Q) ---\n`;
    txt += `${SECTION_DESCS[s]}\n\n`;
    qs.forEach((q, i) => {
      const ctx = q.a.replace(/<[^>]*>/g, '');
      txt += `${i+1}. [${q.d.toUpperCase()}] ${q.q}\n   ${ctx.replace(/\n/g, '\n   ')}\n\n`;
    });
  });
  txt += '\nGenerated by Jap App Hub - laravel-interview.html\n';
  const blob = new Blob([txt], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'laravel-interview-questions.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  let html = '';
  let currentParent = '';
  SECTION_ORDER.forEach(s => {
    const count = questions.filter(q => q.s === s).length;
    const p = SECTION_PARENT[s];
    if (p !== currentParent) {
      currentParent = p;
      html += `<div class="nav-section">${PARENT_LABELS[p]}</div>`;
    }
    html += `<a class="nav-link" href="#sec-${s}"><i class="${SECTION_ICONS[s] || 'bi-tag'}"></i>${SECTION_NAMES[s]} <span class="count">${count}</span></a>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.nav-link').forEach(a => a.addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('show');
  }));
}

function renderContent() {
  const body = document.getElementById('contentBody');
  if (filtered.length === 0) {
    body.innerHTML = `<div class="empty-state"><i class="bi bi-search"></i><h5>No questions match</h5><p>Try broadening your filters or search terms.</p></div>`;
    return;
  }
  let html = '';
  let currentSection = '';
  SECTION_ORDER.forEach(s => {
    const qs = filtered.filter(q => q.s === s);
    if (!qs.length) return;
    const sectionName = SECTION_NAMES[s] || s;
    const total = questions.filter(q => q.s === s).length;
    html += `<div class="section-group" id="sec-${s}">
      <div class="section-header">
        <h2><i class="${SECTION_ICONS[s] || 'bi-tag'}"></i>${sectionName}</h2>
        <span class="section-count">${qs.length}/${total}</span>
      </div>
      <div class="section-desc">${SECTION_DESCS[s] || ''}</div>`;
    qs.forEach((q, idx) => {
      const countInSection = qs.length;
      const localIdx = idx + 1;
      const p = progress[q.id];
      const isOpen = p === 'revealed';
      const dotClass = p === 'got' ? 'got' : p === 'review' ? 'review' : p === 'skip' ? 'skip' : '';
      html += `<div class="q-card${isOpen?' open':''}">
        <div class="q-card-header" data-id="${q.id}">
          <span class="q-num">#${q.id}</span>
          <span class="q-text">${q.q}</span>
          <div class="q-badges">
            <span class="q-badge qb-${q.d}">${q.d === 'easy' ? 'Easy' : q.d === 'med' ? 'Med' : 'Hard'}</span>
          </div>
          <div class="q-progress">
            <span class="dot got${p==='got'?' got':''}" data-action="got" title="Got it"></span>
            <span class="dot review${p==='review'?' review':''}" data-action="review" title="Review"></span>
            <span class="dot skip${p==='skip'?' skip':''}" data-action="skip" title="Skip"></span>
          </div>
          <i class="bi bi-chevron-down q-expand"></i>
        </div>
        <div class="q-card-body">${q.a}</div>
      </div>`;
    });
    html += `</div>`;
  });
  body.innerHTML = html;

  body.querySelectorAll('.q-card-header').forEach(h => {
    h.addEventListener('click', e => {
      if (e.target.closest('.q-progress')) return;
      const card = h.closest('.q-card');
      const body = card.querySelector('.q-card-body');
      const id = parseInt(h.dataset.id);
      const wasOpen = card.classList.contains('open');
      card.classList.toggle('open');
      progress[id] = wasOpen ? 'viewed' : 'revealed';
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      if (!wasOpen) highlightCode(body);
      updateStats();
    });
    h.querySelectorAll('.dot').forEach(d => {
      d.addEventListener('click', e => {
        e.stopPropagation();
        const id = parseInt(h.dataset.id);
        const action = d.dataset.action;
        if (progress[id] === action) delete progress[id];
        else progress[id] = action;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        renderContent();
        updateStats();
      });
    });
  });
  highlightCode();
}

function highlightCode(ctx) {
  (ctx||document).querySelectorAll('.q-card-body pre code').forEach(b => {
    let h = b.innerHTML;
    h = h.replace(/(\/\/.*?)(?:\n|$)/g,'<span class="cm">$1</span>\n')
         .replace(/(\/\*[\s\S]*?\*\/)/g,'<span class="cm">$1</span>')
         .replace(/(#[^\n]*)/g,'<span class="cm">$1</span>')
         .replace(/(&lt;\?php)/g,'<span class="cm">$1</span>')
         .replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g,'<span class="str">$1</span>')
         .replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="num">$1</span>')
         .replace(/\b(string|int|float|bool|array|void|mixed|never|self|static|callable|iterable|object|Resource|null|true|false)\b(?!\s*\()/g,'<span class="tp">$1</span>')
         .replace(/\b(if|else|for|foreach|while|function|return|new|class|public|private|protected|static|readonly|use|namespace|extends|implements|const|echo|fn|as|abstract|final|trait|interface|enum|throw|try|catch|finally|switch|case|default|break|continue|declare|strict_types|global|include|require|list|isset|unset|die|exit|array|instanceof|clone|match|SELECT|FROM|WHERE|JOIN|LEFT|RIGHT|INNER|OUTER|CROSS|ON|AND|OR|IN|NOT|EXISTS|LIKE|GROUP BY|ORDER BY|HAVING|LIMIT|OFFSET|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|ALTER|DROP|INDEX|UNIQUE|FULLTEXT|PRIMARY|KEY|FOREIGN|REFERENCES|CONSTRAINT|DEFAULT|CHECK|CASCADE|SET NULL|TRUNCATE|DISTINCT|UNION|ALL|CASE|WHEN|THEN|ELSE|END|AS|COUNT|SUM|AVG|MIN|MAX|COALESCE|NULL|IS|BETWEEN|OVER|PARTITION|RANK|DENSE_RANK|ROW_NUMBER|LEAD|LAG|NTILE|FIRST_VALUE|LAST_VALUE|START|TRANSACTION|COMMIT|ROLLBACK|SAVEPOINT|DELIMITER|PROCEDURE|FUNCTION|BEGIN|END|DECLARE|CURSOR|LOOP|WHILE|REPEAT|UNTIL|ITERATE|LEAVE|RETURN|DETERMINISTIC|LANGUAGE|SQL|SECURITY|DEFINER|INVOKER|GRANT|REVOKE|EXPLAIN|ANALYZE|DESCRIBE|SHOW|USE|DATABASE|SCHEMA|CHARSET|COLLATE|ENGINE|InnoDB|MyISAM|MEMORY|AUTO_INCREMENT|CURRENT_TIMESTAMP|NOW)\b/g,'<span class="kw">$1</span>')
         .replace(/(\$[\w]+)/g,'<span class="kw">$1</span>')
         .replace(/\b(dd|dump|response|view|redirect|route|auth|bcrypt|collect|array_merge|count|implode|json_encode|json_decode|strlen|substr|str_replace|preg_match|preg_replace|explode|in_array|array_key_exists|method_exists|array_map|array_filter|array_reduce|array_keys|array_values|array_search|sort|array_unique|array_chunk|array_column|session_start|resolve|app|config|env|__|trans|event|dispatch|queue|notify|broadcast|validator|Rule|sometimes|required_with|filled|present|prohibited|prohibited_if|prohibits|missing)\(/g,'<span class="fn">$1</span>(');
    b.innerHTML = h;
  });
}

function updateStats() {
  const total = questions.length;
  const shown = filtered.length;
  const viewed = Object.keys(progress).filter(k => {
    const v = progress[k];
    return v && v !== 'skip';
  }).length;
  const got = Object.values(progress).filter(v => v === 'got').length;
  const review = Object.values(progress).filter(v => v === 'review').length;
  document.getElementById('totalQ').textContent = total;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statViewed').textContent = viewed;
  document.getElementById('statGot').textContent = got;
  document.getElementById('statReview').textContent = review;
  document.getElementById('statShown').textContent = shown;
  const pct = total > 0 ? Math.round((viewed / total) * 100) : 0;
  document.getElementById('progressPct').textContent = pct + '% complete';
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value;
  applyFilters();
  renderContent();
  updateStats();
});

document.getElementById('diffFilters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  ELS('.chip[data-filter]').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  diffFilter = chip.dataset.filter.replace('diff-', '');
  applyFilters();
  renderContent();
  updateStats();
});

document.getElementById('themeToggle').addEventListener('click', () => {
  const html = document.documentElement;
  const theme = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-bs-theme', theme);
  localStorage.setItem('lv_theme', theme);
  document.getElementById('themeToggle').innerHTML = theme === 'dark' ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-fill"></i>';
});

document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('show');
});

const scrollBtn = document.getElementById('scrollTop');
window.addEventListener('scroll', () => scrollBtn.classList.toggle('show', window.scrollY > 400));
scrollBtn.addEventListener('click', () => window.scrollTo({top:0,behavior:'smooth'}));

(function initTheme() {
  const saved = localStorage.getItem('lv_theme');
  if (saved) {
    document.documentElement.setAttribute('data-bs-theme', saved);
    document.getElementById('themeToggle').innerHTML = saved === 'dark' ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-fill"></i>';
  }
})();

init();
</script>
</body>
</html>
